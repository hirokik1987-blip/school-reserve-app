<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SchooRoom | 特別教室予約確認ボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        notion: {
                            bg: '#FBFBFA',
                            sidebar: '#F3F3F1',
                            border: '#E6E6E3',
                            text: '#2C2C2B',
                            muted: '#787774',
                            hover: '#EDEDEA'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        body {
            background-color: #FBFBFA;
            color: #2C2C2B;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            font-size: 1.15rem;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .reservation-tile {
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            user-select: none;
        }
        .reservation-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
        }
        .reservation-tile:active {
            cursor: grabbing;
        }
        .reservation-tile.dragging {
            opacity: 0.45;
            transform: scale(0.96);
        }
        .drop-zone {
            transition: background-color 0.15s ease, outline 0.15s ease;
        }
        .drop-zone.drag-over {
            background-color: rgba(79, 70, 229, 0.08) !important;
            outline: 2px dashed #4F46E5;
            outline-offset: -3px;
        }
        .move-target-pulse {
            animation: pulseBorder 1.5s infinite;
        }
        @keyframes pulseBorder {
            0%, 100% { border-color: #6366f1; background-color: rgba(99, 102, 241, 0.06); }
            50% { border-color: #4f46e5; background-color: rgba(99, 102, 241, 0.16); }
        }
        /* モバイル環境で入力フォーカス時のズームを防止 */
        input[type="text"], input[type="time"], input[type="date"], select {
            font-size: 16px !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-0 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- ヘッダー (スマホではスリム化し、固定を解除) -->
    <header class="bg-white border-b border-notion-border px-3 py-1.5 sm:px-6 sm:py-2 z-30">
        <div class="max-w-[1900px] mx-auto flex flex-col md:flex-row md:items-center justify-between gap-2">
            <!-- App Brand & Live Date Status -->
            <div class="flex items-center justify-between sm:justify-start gap-3">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-7 h-7 sm:w-10 sm:h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-sm shrink-0">
                        <i class="ph-bold ph-squares-four text-lg sm:text-xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] sm:text-xs font-bold text-indigo-600 tracking-wider">SchooRoom</span>
                        <h1 class="font-bold text-sm sm:text-xl tracking-tight text-notion-text flex items-center gap-2 flex-wrap leading-tight">
                            特別教室予約確認ボード
                            <span id="liveTodayBadge" class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 text-[10px] sm:text-xs font-semibold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>本日
                            </span>
                        </h1>
                    </div>
                </div>
                <!-- スマホ用 クラウドステータス（極小） -->
                <div class="sm:hidden flex items-center gap-1 text-[10px] font-bold text-sky-600 px-2 py-0.5 rounded bg-sky-50 border border-sky-100" id="mobileCloudStatus">
                    <span class="w-1 h-1 rounded-full bg-sky-500 animate-pulse" id="mobileCloudDot"></span>通信中
                </div>
            </div>

            <!-- Date Picker & Day Schedule Mode Controls -->
            <div class="flex flex-wrap items-center gap-1 sm:gap-3 bg-notion-sidebar p-1 sm:p-2 rounded-lg border border-notion-border justify-between sm:justify-start">
                <div class="flex items-center gap-1">
                    <button onclick="window.shiftSelectedDate(-1)" class="p-1 sm:p-2 rounded-md hover:bg-white hover:shadow-sm text-notion-text transition" title="前日へ">
                        <i class="ph-bold ph-caret-left text-base sm:text-xl"></i>
                    </button>
                    <div class="relative flex items-center">
                        <input
                            type="date"
                            id="headerDatePicker"
                            onchange="window.handleDateInput(this.value)"
                            class="bg-transparent font-bold text-sm sm:text-lg px-1 py-0.5 sm:px-2 sm:py-1 rounded-md hover:bg-white focus:bg-white focus:outline-none cursor-pointer w-[115px] sm:w-[135px]"
                        />
                    </div>
                    <span id="selectedDayOfWeek" class="text-xs sm:text-sm font-bold px-1 py-0.5 sm:px-2 sm:py-1 rounded-md bg-white border border-notion-border text-notion-text shrink-0"></span>
                    <button onclick="window.shiftSelectedDate(1)" class="p-1 sm:p-2 rounded-md hover:bg-white hover:shadow-sm text-notion-text transition" title="翌日へ">
                        <i class="ph-bold ph-caret-right text-base sm:text-xl"></i>
                    </button>
                </div>
                <div class="flex items-center gap-1 sm:gap-2 ml-auto sm:ml-0">
                    <button onclick="window.jumpToToday()" id="btnJumpToday" class="px-2 py-1 sm:px-3 sm:py-1.5 text-xs sm:text-sm font-semibold rounded-md bg-white border border-notion-border hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition shadow-2xs">
                        今日
                    </button>
                    <!-- 6校時日課 / 5校時日課 切替ボタン -->
                    <button
                        onclick="window.toggleDayScheduleMode()"
                        id="btnDayScheduleMode"
                        class="px-2 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-sm font-bold rounded-md border transition flex items-center gap-1 shadow-2xs"
                    >
                        <i class="ph-bold ph-arrows-clockwise text-xs sm:text-base"></i>
                        <span id="dayScheduleModeLabel">6校時日課</span>
                    </button>
                </div>
            </div>

            <!-- Action Buttons (Desktop Only) -->
            <div class="hidden md:flex items-center gap-2">
                <div id="cloudStatusBadge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-50 border border-sky-200 text-sky-700 text-xs font-semibold transition-colors">
                    <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-sky-500 animate-pulse transition-colors"></span>
                    <span id="cloudStatusText">クラウド接続中...</span>
                </div>
                <button onclick="window.openAddRoomModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-notion-border hover:bg-notion-hover text-notion-text transition shadow-2xs">
                    <i class="ph-bold ph-door-open text-indigo-600 text-sm"></i>
                    <span>教室管理</span>
                </button>
            </div>
        </div>
    </header>

    <!-- デスクトップ用 タブナビゲーション -->
    <div class="bg-white border-b border-notion-border px-4 sm:px-6 py-2 hidden md:block z-20">
        <div class="max-w-[1900px] mx-auto flex items-center gap-2">
            <button onclick="window.switchView('weekly')" id="tab-weekly" class="view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-calendar-week text-lg"></i><span>週間表示</span>
            </button>
            <button onclick="window.switchView('matrix')" id="tab-matrix" class="view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-grid-four text-lg"></i><span>当日一覧</span>
            </button>
            <button onclick="window.switchView('calendar')" id="tab-calendar" class="view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-calendar-blank text-lg"></i><span>カレンダー</span>
            </button>
        </div>
    </div>

    <!-- Touch / Click Move Mode Active Banner -->
    <div id="mobileMoveBanner" class="hidden sticky top-0 z-40 bg-indigo-600 text-white px-4 py-3 sm:px-6 sm:py-5 shadow-md">
        <div class="max-w-[1900px] mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 text-sm sm:text-lg font-bold min-w-0">
                <i class="ph-bold ph-arrows-out-cardinal text-xl sm:text-3xl animate-bounce shrink-0"></i>
                <span id="mobileMoveBannerText" class="truncate">移動先の空き枠（または入替枠）をタップ</span>
            </div>
            <button onclick="window.cancelTileMoveMode()" class="px-4 py-2 sm:px-6 sm:py-3 rounded-lg bg-white/20 hover:bg-white/30 text-white text-sm sm:text-lg font-bold shrink-0 transition">
                キャンセル
            </button>
        </div>
    </div>

    <main class="flex-1 max-w-[1900px] w-full mx-auto px-2 sm:px-12 py-4 sm:py-10 space-y-6 sm:space-y-12">

        <!-- VIEW: Weekly (全教室週間表示) -->
        <section id="view-weekly" class="space-y-4 sm:space-y-8">
            <div class="bg-white rounded-xl sm:rounded-2xl border border-notion-border p-3 sm:p-10 shadow-2xs flex flex-col">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-4 sm:mb-6 pb-4 border-b border-notion-border">
                    <h3 class="font-bold text-lg sm:text-3xl text-notion-text flex items-center gap-2 sm:gap-3">
                        <i class="ph-bold ph-calendar-week text-indigo-600"></i> 週間表示 (全教室)
                    </h3>
                    <div class="flex items-center gap-2 sm:gap-4">
                        <button onclick="window.shiftSelectedDate(-7)" class="px-3 py-1.5 sm:px-6 sm:py-3 text-xs sm:text-lg font-semibold rounded-lg border border-notion-border hover:bg-notion-hover bg-white">◀ 前週</button>
                        <button onclick="window.shiftSelectedDate(7)" class="px-3 py-1.5 sm:px-6 sm:py-3 text-xs sm:text-lg font-semibold rounded-lg border border-notion-border hover:bg-notion-hover bg-white">翌週 ▶</button>
                    </div>
                </div>
                <div class="overflow-x-auto">
                    <div id="allRoomsWeeklyGrid" class="min-w-[800px]">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: Matrix (当日一覧 - 全教室スケジュール表) -->
        <section id="view-matrix" class="hidden space-y-6">
            <!-- 凡例 -->
            <div class="hidden sm:flex flex-col lg:flex-row lg:items-center justify-between gap-6 bg-white px-8 py-5 rounded-2xl border border-notion-border shadow-2xs">
                <div class="flex items-center gap-4">
                    <i class="ph-fill ph-sparkle text-indigo-600 text-2xl"></i>
                    <h2 id="matrixDateHeading" class="font-bold text-2xl flex items-center gap-4 flex-wrap"></h2>
                </div>
                <div class="flex flex-wrap items-center gap-3 text-base">
                    <span class="px-3 py-1.5 rounded-lg bg-blue-50 text-blue-700 font-semibold border border-blue-200">授業</span>
                    <span class="px-3 py-1.5 rounded-lg bg-orange-50 text-orange-700 font-semibold border border-orange-200">部活動</span>
                    <span class="px-3 py-1.5 rounded-lg bg-purple-50 text-purple-700 font-semibold border border-purple-200">行事</span>
                    <span class="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-800 font-semibold border border-amber-200">会議</span>
                    <span class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-semibold border border-slate-300">その他</span>
                </div>
            </div>

            <!-- Matrix Scrollable Container -->
            <div id="matrixTableWrapper" class="bg-white rounded-xl sm:rounded-2xl border border-notion-border shadow-xs overflow-hidden">
                <div class="overflow-x-auto">
                    <div id="matrixGridContainer" class="w-full min-w-[700px] lg:min-w-0">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: Calendar (月間カレンダー) -->
        <section id="view-calendar" class="hidden space-y-8">
            <div class="bg-white rounded-2xl border border-notion-border p-4 sm:p-10 shadow-2xs">
                <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
                    <div class="flex items-center gap-4 sm:gap-8">
                        <h2 id="calendarMonthHeading" class="font-bold text-2xl sm:text-4xl text-notion-text"></h2>
                        <div class="flex items-center gap-2 bg-notion-sidebar p-2 rounded-xl border border-notion-border">
                            <button onclick="window.changeCalendarMonth(-1)" class="p-2 sm:p-3 rounded-lg hover:bg-white text-base font-bold"><i class="ph-bold ph-caret-left"></i></button>
                            <button onclick="window.resetCalendarToCurrentMonth()" class="px-3 py-2 sm:px-5 rounded-lg hover:bg-white text-sm sm:text-base font-bold">今月</button>
                            <button onclick="window.changeCalendarMonth(1)" class="p-2 sm:p-3 rounded-lg hover:bg-white text-base font-bold"><i class="ph-bold ph-caret-right"></i></button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-1 sm:gap-4 text-center text-sm sm:text-lg font-bold text-notion-muted mb-3">
                    <div class="py-2 sm:py-4 text-rose-600 bg-rose-50/60 rounded-lg">日</div>
                    <div class="py-2 sm:py-4 bg-notion-sidebar rounded-lg">月</div>
                    <div class="py-2 sm:py-4 bg-notion-sidebar rounded-lg">火</div>
                    <div class="py-2 sm:py-4 bg-notion-sidebar rounded-lg">水</div>
                    <div class="py-2 sm:py-4 bg-notion-sidebar rounded-lg">木</div>
                    <div class="py-2 sm:py-4 bg-notion-sidebar rounded-lg">金</div>
                    <div class="py-2 sm:py-4 text-sky-600 bg-sky-50/60 rounded-lg">土</div>
                </div>

                <div id="calendarDaysGrid" class="grid grid-cols-7 gap-1 sm:gap-4">
                    <!-- Populated dynamically -->
                </div>

                <div id="calendarMobileDayDetail" class="mt-8 sm:mt-12 pt-8 border-t border-notion-border">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

    </main>

    <!-- Mobile Fixed Bottom Navigation Bar (コンパクト化) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-notion-border px-1 py-1.5 flex items-center justify-around shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
        <button onclick="window.switchView('weekly')" id="mob-tab-weekly" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-calendar-week text-xl"></i>
            <span>週間表示</span>
        </button>
        <button onclick="window.switchView('matrix')" id="mob-tab-matrix" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-grid-four text-xl"></i>
            <span>当日一覧</span>
        </button>
        <button onclick="window.switchView('calendar')" id="mob-tab-calendar" class="flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-calendar-blank text-xl"></i>
            <span>カレンダー</span>
        </button>
        <button onclick="window.openReservationModal()" class="flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-lg text-[10px] font-bold bg-indigo-600 text-white shadow-xs transition w-1/4">
            <i class="ph-bold ph-plus-circle text-xl"></i>
            <span>新規予約</span>
        </button>
    </nav>

    <!-- Reservation Modal (レイアウト全面改修) -->
    <div id="reservationModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-3 sm:p-4">
        <div class="bg-white rounded-2xl sm:rounded-3xl border border-notion-border shadow-2xl max-w-2xl w-full flex flex-col max-h-[92vh] relative">
            
            <div class="flex items-center justify-between px-5 py-4 sm:px-6 sm:py-5 border-b border-notion-border bg-notion-sidebar shrink-0 rounded-t-2xl sm:rounded-t-3xl">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
                        <i class="ph-bold ph-calendar-plus text-lg sm:text-xl"></i>
                    </div>
                    <h3 id="reservationModalTitle" class="font-bold text-base sm:text-xl text-notion-text">特別教室を予約する</h3>
                </div>
                <button type="button" onclick="window.closeReservationModal()" class="p-1.5 sm:p-2 rounded-lg text-notion-muted hover:text-notion-text hover:bg-white transition">
                    <i class="ph-bold ph-x text-xl sm:text-2xl"></i>
                </button>
            </div>

            <form id="reservationForm" onsubmit="window.saveReservationForm(event)" class="p-4 sm:p-8 space-y-5 sm:space-y-6 overflow-y-auto flex-1 no-scrollbar bg-white" novalidate>
                <input type="hidden" id="resFormId" />

                <!-- Step 1: 教室・日付・時間帯の確認 -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-notion-sidebar/50 p-3 sm:p-4 rounded-xl border border-notion-border">
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-notion-muted mb-1">特別教室</label>
                        <select id="resFormRoom" required onchange="window.checkFormConflictWarning()" class="w-full px-3 py-2 sm:py-2.5 rounded-lg border border-notion-border text-sm sm:text-base font-bold bg-white focus:ring-2 focus:ring-indigo-500">
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-notion-muted mb-1">利用日</label>
                        <input type="date" id="resFormDate" required onchange="window.handleModalDateOrPeriodChange()" class="w-full px-3 py-2 sm:py-2.5 rounded-lg border border-notion-border text-sm sm:text-base font-bold bg-white focus:ring-2 focus:ring-indigo-500" />
                    </div>
                    <div>
                        <label class="block text-xs sm:text-sm font-bold text-notion-muted mb-1">コマ</label>
                        <select id="resFormPeriod" required onchange="window.handleModalDateOrPeriodChange()" class="w-full px-3 py-2 sm:py-2.5 rounded-lg border border-notion-border text-sm sm:text-base font-bold bg-white focus:ring-2 focus:ring-indigo-500">
                        </select>
                    </div>
                </div>

                <div id="resFormConflictBanner" class="hidden p-3 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs sm:text-sm flex items-start gap-2">
                    <i class="ph-fill ph-warning-circle text-base sm:text-lg text-amber-600 shrink-0 mt-0.5"></i>
                    <div id="resFormConflictText"></div>
                </div>

                <!-- Step 2: カテゴリー ＆ 予約者 -->
                <div class="rounded-xl border border-notion-border p-4 sm:p-5 space-y-5">
                    <div>
                        <label class="text-sm font-bold text-notion-text mb-2.5 block">1. カテゴリーを選択</label>
                        <div id="resFormCategoryGroup" class="grid grid-cols-5 gap-1.5 sm:gap-2">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <div class="pt-4 border-t border-notion-border">
                        <label for="resFormUser" class="text-sm font-bold text-notion-text mb-2 flex items-center justify-between">
                            <span>2. だれが予約したか <span class="text-xs text-notion-muted font-normal">（学年・部活動など）</span></span>
                            <span class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded bg-rose-100 text-rose-700 font-bold">必須</span>
                        </label>
                        <input type="text" id="resFormUser" oninput="window.clearUserValidationError()" placeholder="例: 佐藤 / 2学年 / バスケ部" class="w-full px-3 py-2.5 sm:px-4 sm:py-3 rounded-lg border border-notion-border bg-white text-base sm:text-lg font-bold focus:ring-2 focus:ring-indigo-500 shadow-2xs" />
                        <p id="resFormUserError" class="hidden mt-1 text-xs font-bold text-rose-600">入力してください</p>
                        
                        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 mt-3">
                            <button type="button" onclick="window.fillUserPreset('1年')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">1年</button>
                            <button type="button" onclick="window.fillUserPreset('2年')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">2年</button>
                            <button type="button" onclick="window.fillUserPreset('3年')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">3年</button>
                            <button type="button" onclick="window.fillUserPreset('4学年')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">4学年</button>
                            <button type="button" onclick="window.fillUserPreset('1部')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">1部</button>
                            <button type="button" onclick="window.fillUserPreset('2部')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">2部</button>
                            <button type="button" onclick="window.fillUserPreset('3部')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">3部</button>
                            <button type="button" onclick="window.fillUserPreset('4部')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">4部</button>
                            <button type="button" onclick="window.fillUserPreset('7部')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">7部</button>
                            <button type="button" onclick="window.fillUserPreset('8部')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">8部</button>
                            <button type="button" onclick="window.fillUserPreset('生徒会')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">生徒会</button>
                            <button type="button" onclick="window.fillUserPreset('部活動')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-notion-sidebar border border-notion-border hover:bg-indigo-50 font-medium">部活動</button>
                            <button type="button" onclick="window.fillUserPreset('教頭')" class="text-xs px-2.5 py-1.5 sm:px-3 sm:py-1.5 rounded-md bg-indigo-50 text-indigo-700 border border-indigo-200 hover:bg-indigo-100 font-bold">教頭</button>
                        </div>
                    </div>
                </div>

                <!-- Step 3: 詳細 -->
                <div class="rounded-xl border border-notion-border bg-notion-sidebar/40 p-4 space-y-3">
                    <h4 class="text-xs sm:text-sm font-bold text-notion-text flex items-center gap-1.5"><i class="ph-bold ph-pencil-simple text-indigo-600"></i>詳細（任意）</h4>
                    <input type="text" id="resFormTitle" placeholder="授業名・利用目的など" class="w-full px-3 py-2 rounded-lg border border-notion-border text-xs sm:text-sm" />
                    <input type="text" id="resFormMemo" placeholder="連絡事項・備品メモなど" class="w-full px-3 py-2 rounded-lg border border-notion-border text-xs sm:text-sm" />
                    
                    <div class="pt-2 flex items-center gap-2">
                        <label class="flex items-center gap-1.5 text-xs font-bold text-notion-text cursor-pointer">
                            <input type="checkbox" id="resFormUseCustomTime" onchange="window.toggleCustomTimeInputs()" class="rounded w-3.5 h-3.5 border-notion-border text-indigo-600 focus:ring-indigo-500" />
                            時間指定
                        </label>
                        <div id="customTimeInputsWrapper" class="flex items-center gap-1 opacity-50 pointer-events-none">
                            <input type="time" id="resFormStartTime" class="px-2 py-1 rounded border border-notion-border text-xs w-20" />
                            <span class="text-xs text-notion-muted">〜</span>
                            <input type="time" id="resFormEndTime" class="px-2 py-1 rounded border border-notion-border text-xs w-20" />
                        </div>
                    </div>
                </div>

                <!-- 画面下部の余白用（スマホでスクロールしやすくするため） -->
                <div class="h-16 sm:h-0"></div>
            </form>
            
            <!-- Primary Action Buttons (Fixed at bottom of modal) -->
            <div class="absolute bottom-0 left-0 right-0 p-3 sm:p-5 bg-white border-t border-notion-border flex items-center justify-center gap-2 sm:gap-3 rounded-b-2xl sm:rounded-b-3xl">
                <button type="button" id="btnDeleteReservation" onclick="window.deleteCurrentReservation()" class="hidden px-3 py-2.5 sm:px-5 sm:py-3.5 rounded-xl text-xs sm:text-sm font-bold text-rose-600 bg-rose-50 border border-rose-200">
                    削除
                </button>
                <button type="button" id="btnStartTouchMove" onclick="window.triggerMoveFromModal()" class="hidden px-3 py-2.5 sm:px-5 sm:py-3.5 rounded-xl text-xs sm:text-sm font-bold text-indigo-700 bg-indigo-50 border border-indigo-200 flex items-center gap-1">
                    <i class="ph-bold ph-arrows-out-cardinal text-sm sm:text-lg"></i> 移動
                </button>
                <button type="button" onclick="window.closeReservationModal()" class="px-4 py-2.5 sm:px-6 sm:py-3.5 rounded-xl text-xs sm:text-sm font-bold text-notion-text bg-notion-sidebar border border-notion-border hover:bg-notion-border transition">
                    キャンセル
                </button>
                <button type="submit" onclick="document.getElementById('reservationForm').dispatchEvent(new Event('submit', {cancelable: true, bubbles: true}))" class="px-6 py-2.5 sm:px-10 sm:py-3.5 rounded-xl text-xs sm:text-base font-bold text-white bg-indigo-600 hover:bg-indigo-700 flex items-center justify-center gap-2 flex-1 shadow-md transition">
                    <i class="ph-bold ph-check-circle text-base sm:text-lg"></i>
                    <span id="btnSubmitReservationText">予約確定</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 sm:bottom-12 sm:right-12 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <!-- 🌟 Firebase 設定 ＆ アプリロジック (Type Module) 🌟 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        // Firebase構成情報
        const firebaseConfig = {
            apiKey: "AIzaSyBOUoCFaseKszQ9-yO6cb87IOJImQL-_uw",
            authDomain: "schooroom-ddcdd.firebaseapp.com",
            projectId: "schooroom-ddcdd",
            storageBucket: "schooroom-ddcdd.firebasestorage.app",
            messagingSenderId: "163341369660",
            appId: "1:163341369660:web:16ee8234c8c74b506c1e39"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];
        const TIME_PERIODS = [
            { id: 'p1',     label: '1校時',             time: '08:50 - 09:40',  short: '1校時',   defaultStart: '08:50', defaultEnd: '09:40' },
            { id: 'p2',     label: '2校時',             time: '09:50 - 10:40',  short: '2校時',   defaultStart: '09:50', defaultEnd: '10:40' },
            { id: 'p3',     label: '3校時',             time: '10:55 - 11:45',  short: '3校時',   defaultStart: '10:55', defaultEnd: '11:45' },
            { id: 'p4',     label: '4校時',             time: '11:55 - 12:45',  short: '4校時',   defaultStart: '11:55', defaultEnd: '12:45' },
            { id: 'lunch',  label: '昼休み',            time: '12:45 - 13:35',  short: '昼休',    defaultStart: '12:45', defaultEnd: '13:35' },
            { id: 'p5',     label: '5校時',             time: '13:40 - 14:30',  short: '5校時',   defaultStart: '13:40', defaultEnd: '14:30' },
            { id: 'p6',     label: '6校時',             time: '14:40 - 15:30',  short: '6校時',   defaultStart: '14:40', defaultEnd: '15:30', label5Period: '放課後(5限後)', time5Period: '14:40 - 15:30' },
            { id: 'after1', label: '放課後(〜16:30)',   time: '15:30 - 16:30',  short: '〜16:30', defaultStart: '15:30', defaultEnd: '16:30', allowFreeTime: true },
            { id: 'after2', label: '16:30以降(フリー)', time: '16:30〜 時間自由', short: '16:30〜', defaultStart: '16:30', defaultEnd: '18:00', allowFreeTime: true, isFreeSlot: true }
        ];

        const CATEGORIES = [
            { id: 'class',     label: '授業',        bg: 'bg-blue-50',   border: 'border-blue-200',   text: 'text-blue-800',   dot: 'bg-blue-500' },
            { id: 'club',      label: '部活動',      bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-800', dot: 'bg-orange-500' },
            { id: 'event',     label: '行事・集会',  bg: 'bg-purple-50', border: 'border-purple-200', text: 'text-purple-800', dot: 'bg-purple-500' },
            { id: 'committee', label: '会議',        bg: 'bg-amber-50',  border: 'border-amber-200',  text: 'text-amber-900',  dot: 'bg-amber-500' },
            { id: 'other',     label: 'その他',      bg: 'bg-slate-100', border: 'border-slate-300',  text: 'text-slate-800',  dot: 'bg-slate-500' }
        ];

        const ROOM_COLOR_MAP = {
            orange:  { badgeBg: 'bg-orange-100',  badgeText: 'text-orange-700' },
            amber:   { badgeBg: 'bg-amber-100',   badgeText: 'text-amber-800' },
            emerald: { badgeBg: 'bg-emerald-100', badgeText: 'text-emerald-700' },
            violet:  { badgeBg: 'bg-violet-100',  badgeText: 'text-violet-700' },
            pink:    { badgeBg: 'bg-pink-100',    badgeText: 'text-pink-700' },
            sky:     { badgeBg: 'bg-sky-100',     badgeText: 'text-sky-700' },
            indigo:  { badgeBg: 'bg-indigo-100',  badgeText: 'text-indigo-700' },
            teal:    { badgeBg: 'bg-teal-100',    badgeText: 'text-teal-700' }
        };

        const DEFAULT_ROOMS = [
            { id: 'gym',      name: '体育館',   icon: 'ph-basketball',         color: 'orange' },
            { id: 'martial',  name: '柔剣道場', icon: 'ph-shield-chevron',     color: 'amber' },
            { id: 'multi',    name: '多目的室', icon: 'ph-presentation-chart', color: 'emerald' },
            { id: 'music1',   name: '1音',      icon: 'ph-music-notes',        color: 'violet' },
            { id: 'music2',   name: '2音',      icon: 'ph-piano-keys',         color: 'pink' },
            { id: 'lounge',   name: '談話室',   icon: 'ph-chats-circle',       color: 'sky' },
            { id: 'meeting',  name: '会議室',   icon: 'ph-users-three',        color: 'indigo' }
        ];

        function formatDateISO(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        function parseDateISO(isoStr) { const [y, m, d] = isoStr.split('-').map(Number); return new Date(y, m - 1, d); }
        function addDaysISO(isoStr, days) { const dt = parseDateISO(isoStr); dt.setDate(dt.getDate() + days); return formatDateISO(dt); }
        function formatJapaneseDateLabel(isoStr) { const dt = parseDateISO(isoStr); return `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日（${DAY_NAMES[dt.getDay()]}）`; }
        function escapeHTML(str) { return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]) : ''; }
        function formatShortRoomName(name) {
            const map = { '体育館':'体育館', '柔剣道場':'柔剣道', '多目的室':'多目的', '1音':'1音', '2音':'2音', '談話室':'談話室', '会議室':'会議室' };
            return map[name] || (name.length > 3 ? name.substring(0, 3) : name);
        }

        const todayISO = formatDateISO(new Date());

        const state = {
            todayISO: todayISO,
            selectedDate: todayISO,
            currentView: 'weekly',
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            selectedCategory: 'class',
            draggedReservationId: null,
            movingReservationId: null,
            dayScheduleModes: {},
            rooms: JSON.parse(JSON.stringify(DEFAULT_ROOMS)),
            reservations: []
        };

        // ====== Firebase リスニング ＆ 過去データの自動削除 ======
        let hasCheckedForOldData = false; // お掃除実行済みフラグ
        let isInitialLoad = true;

        onValue(ref(database, 'reservations'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state.reservations = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            } else {
                state.reservations = [];
            }

            // 🚀 過去データの自動削除（お掃除）機能 🚀
            // アプリ起動時に1回だけ、昨日より前の予約データを探して削除します
            if (!hasCheckedForOldData && data) {
                hasCheckedForOldData = true;
                const oldIdsToDelete = [];
                state.reservations.forEach(res => {
                    // 予約日が今日（todayISO）より過去の場合、削除リストに追加
                    if (res.date < state.todayISO) {
                        oldIdsToDelete.push(res.id);
                    }
                });
                
                // 見つかった古いデータをFirebaseから削除
                oldIdsToDelete.forEach(id => {
                    remove(ref(database, 'reservations/' + id));
                    console.log('古い予約データを自動削除しました:', id);
                });
                
                // もし削除したものがあれば、配列からも取り除いておく
                if (oldIdsToDelete.length > 0) {
                    state.reservations = state.reservations.filter(res => !oldIdsToDelete.includes(res.id));
                }
            }
            
            renderAll();

            if (isInitialLoad) {
                isInitialLoad = false;
                document.getElementById('cloudStatusText').textContent = '同期完了 (共有中)';
                const dot = document.getElementById('cloudStatusDot');
                dot.classList.remove('bg-sky-500'); dot.classList.add('bg-emerald-500');
                const badge = document.getElementById('cloudStatusBadge');
                badge.classList.replace('bg-sky-50', 'bg-emerald-50');
                badge.classList.replace('border-sky-200', 'border-emerald-200');
                badge.classList.replace('text-sky-700', 'text-emerald-700');
                const mDot = document.getElementById('mobileCloudDot');
                mDot.classList.remove('bg-sky-500'); mDot.classList.add('bg-emerald-500');
                const mBadge = document.getElementById('mobileCloudStatus');
                mBadge.classList.replace('bg-sky-50', 'bg-emerald-50');
                mBadge.classList.replace('border-sky-100', 'border-emerald-200');
                mBadge.classList.replace('text-sky-600', 'text-emerald-700');
                mBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>同期済`;
            }
        });


        // ====== 状態取得関数 ======
        function getDayScheduleMode(dateStr) { return state.dayScheduleModes[dateStr] || '6period'; }
        function getPeriodDisplayInfo(p, dateStr) {
            if (getDayScheduleMode(dateStr) === '5period' && p.id === 'p6') return { label: p.label5Period, time: p.time5Period, short: '5限後' };
            return { label: p.label, time: p.time, short: p.short };
        }
        function getRoomById(id) { return state.rooms.find(r => r.id === id) || state.rooms[0]; }
        function getPeriodById(id) { return TIME_PERIODS.find(p => p.id === id) || TIME_PERIODS[0]; }
        function getCategoryById(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }
        function findReservation(r, d, p) { return state.reservations.find(res => res.roomId === r && res.date === d && res.periodId === p); }

        // ====== Global Functions ======
        window.shiftSelectedDate = function(delta) { state.selectedDate = addDaysISO(state.selectedDate, delta); renderAll(); };
        window.handleDateInput = function(val) { if(val) { state.selectedDate = val; renderAll(); } };
        window.jumpToToday = function() { state.selectedDate = state.todayISO; renderAll(); };
        window.switchView = function(viewName) { state.currentView = viewName; renderAll(); };
        window.toggleDayScheduleMode = function() {
            state.dayScheduleModes[state.selectedDate] = getDayScheduleMode(state.selectedDate) === '6period' ? '5period' : '6period';
            renderAll();
        };
        window.openAddRoomModal = function() { showToast('教室管理機能は現在準備中です', 'info'); };

        function renderAll() {
            renderHeaderControls();
            renderMoveBanner();
            ['matrix', 'weekly', 'calendar'].forEach(v => {
                document.getElementById(`view-${v}`).classList.toggle('hidden', v !== state.currentView);
            });
            if (state.currentView === 'matrix') renderMatrixView();
            else if (state.currentView === 'weekly') renderWeeklyView();
            else if (state.currentView === 'calendar') renderCalendarView();
        }

        function renderHeaderControls() {
            document.getElementById('headerDatePicker').value = state.selectedDate;
            document.getElementById('selectedDayOfWeek').textContent = `${DAY_NAMES[parseDateISO(state.selectedDate).getDay()]}曜日`;

            const modeBtn = document.getElementById('btnDayScheduleMode');
            const modeLabel = document.getElementById('dayScheduleModeLabel');
            if (getDayScheduleMode(state.selectedDate) === '5period') {
                modeBtn.className = 'px-2 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-sm font-bold rounded-md bg-amber-50 text-amber-800 border border-amber-300 flex items-center gap-1';
                modeLabel.textContent = '5校時日課';
            } else {
                modeBtn.className = 'px-2 py-1 sm:px-3 sm:py-1.5 text-[10px] sm:text-sm font-bold rounded-md bg-indigo-50 text-indigo-700 border border-indigo-200 flex items-center gap-1';
                modeLabel.textContent = '6校時日課';
            }

            ['matrix', 'weekly', 'calendar'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const mobBtn = document.getElementById(`mob-tab-${tab}`);
                if (tab === state.currentView) {
                    if(btn) btn.className = 'view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-bold bg-indigo-600 text-white whitespace-nowrap shadow-md';
                    if(mobBtn) mobBtn.className = 'flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-lg text-[10px] font-bold text-indigo-700 bg-indigo-100 shadow-sm w-1/4';
                } else {
                    if(btn) btn.className = 'view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold text-notion-muted hover:bg-notion-sidebar whitespace-nowrap';
                    if(mobBtn) mobBtn.className = 'flex flex-col items-center gap-0.5 px-2 py-1.5 rounded-lg text-[10px] font-bold text-notion-muted w-1/4';
                }
            });
        }

        function renderMoveBanner() {
            const banner = document.getElementById('mobileMoveBanner');
            if (state.movingReservationId) banner.classList.remove('hidden');
            else banner.classList.add('hidden');
        }

        // ====== ドラッグ＆ドロップ / タップ移動 ======
        window.startTileMoveMode = function(id, e) {
            if(e) e.stopPropagation();
            state.movingReservationId = id;
            renderAll();
            showToast('移動先の枠をタップしてください', 'info');
        };
        window.triggerMoveFromModal = function() {
            const id = document.getElementById('resFormId').value;
            window.closeReservationModal();
            window.startTileMoveMode(id);
        };
        window.cancelTileMoveMode = function() { state.movingReservationId = null; renderAll(); };

        window.executeReservationMove = function(dragId, targetR, targetD, targetP) {
            const dragRes = state.reservations.find(r => r.id === dragId);
            if (!dragRes) return;
            const destRoomId = targetR && targetR !== 'null' ? targetR : dragRes.roomId;
            const existRes = findReservation(destRoomId, targetD, targetP);
            
            // Swap if exists
            if (existRes && existRes.id !== dragId) {
                set(ref(database, 'reservations/' + existRes.id), {
                    ...existRes, roomId: dragRes.roomId, date: dragRes.date, periodId: dragRes.periodId
                });
            }
            // Move original
            set(ref(database, 'reservations/' + dragId), {
                ...dragRes, roomId: destRoomId, date: targetD, periodId: targetP
            });

            state.movingReservationId = null;
            showToast('予約を移動しました');
        };

        window.handleDragStart = function(e, id) {
            e.dataTransfer.setData('text/plain', id);
            e.dataTransfer.effectAllowed = 'move';
            state.draggedReservationId = id;
            setTimeout(() => e.target.classList.add('opacity-50', 'scale-95'), 0);
        };
        window.handleDragEnd = function(e) {
            e.target.classList.remove('opacity-50', 'scale-95');
            state.draggedReservationId = null;
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        };
        window.handleDragOver = function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
        window.handleDragEnter = function(e) { e.preventDefault(); const zone = e.target.closest('.drop-zone'); if (zone) zone.classList.add('drag-over'); };
        window.handleDragLeave = function(e) { const zone = e.target.closest('.drop-zone'); if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); };
        window.handleDrop = function(e, targetR, targetD, targetP) {
            e.preventDefault();
            const zone = e.target.closest('.drop-zone');
            if (zone) zone.classList.remove('drag-over');
            const dragId = e.dataTransfer.getData('text/plain') || state.draggedReservationId;
            if (dragId) window.executeReservationMove(dragId, targetR, targetD, targetP);
        };
        
        window.handleSlotInteraction = function(r, d, p, existId = null) {
            if (state.movingReservationId) return window.executeReservationMove(state.movingReservationId, r, d, p);
            if (existId && existId !== 'null') window.openReservationModal({ reservationId: existId });
            else window.openReservationModal({ roomId: r && r !== 'null' ? r : state.rooms[0].id, date: d, periodId: p });
        };

        // ====== Views ======
        function renderMatrixView() {
            const dateH = document.getElementById('matrixDateHeading');
            if (dateH) dateH.textContent = formatJapaneseDateLabel(state.selectedDate);

            let html = `<div class="grid grid-cols-[56px_repeat(9,minmax(80px,1fr))] sm:grid-cols-[100px_repeat(9,minmax(110px,1fr))] border-b border-notion-border bg-notion-sidebar sticky top-0 z-20">
                <div class="bg-notion-sidebar border-r border-notion-border p-2"></div>`;
            TIME_PERIODS.forEach(p => {
                const info = getPeriodDisplayInfo(p, state.selectedDate);
                html += `<div class="px-1 py-2 sm:px-2 sm:py-3 text-center border-r border-notion-border ${p.isFreeSlot ? 'bg-indigo-50/50' : ''}">
                    <div class="text-[11px] sm:text-base font-bold text-notion-text leading-tight">${info.short}</div>
                    <div class="text-[9px] sm:text-xs text-notion-muted hidden sm:block">${info.time.split(' ')[0]}</div>
                </div>`;
            });
            html += `</div>`;

            state.rooms.forEach(room => {
                const theme = ROOM_COLOR_MAP[room.color] || ROOM_COLOR_MAP.indigo;
                const shortRoomName = formatShortRoomName(room.name);

                html += `<div class="grid grid-cols-[56px_repeat(9,minmax(80px,1fr))] sm:grid-cols-[100px_repeat(9,minmax(110px,1fr))] border-b border-notion-border hover:bg-notion-bg/50">
                    <div class="bg-white border-r border-notion-border p-1 sm:p-2 flex flex-col items-center justify-center cursor-pointer">
                        <span class="w-7 h-7 sm:w-10 sm:h-10 rounded-lg ${theme.badgeBg} ${theme.badgeText} flex items-center justify-center mb-1">
                            <i class="ph-bold ${room.icon} text-base sm:text-xl"></i>
                        </span>
                        <span class="font-bold text-[10px] sm:text-sm text-notion-text tracking-tighter leading-none">${escapeHTML(shortRoomName)}</span>
                    </div>`;
                
                TIME_PERIODS.forEach(p => {
                    const res = findReservation(room.id, state.selectedDate, p.id);
                    html += renderSlotTileHTML(room, state.selectedDate, p, res);
                });
                html += `</div>`;
            });
            document.getElementById('matrixGridContainer').innerHTML = html;
        }

        function renderWeeklyView() {
            const weekDays = Array.from({length: 7}, (_, i) => addDaysISO(state.selectedDate, i));
            
            let html = `<div class="grid grid-cols-[60px_repeat(${TIME_PERIODS.length},minmax(90px,1fr))] sm:grid-cols-[100px_repeat(${TIME_PERIODS.length},minmax(120px,1fr))] border border-notion-border bg-notion-sidebar rounded-t-xl overflow-hidden">
                <div class="bg-notion-sidebar border-r border-notion-border"></div>`;
            TIME_PERIODS.forEach(p => {
                const info = getPeriodDisplayInfo(p, state.selectedDate);
                html += `<div class="p-2 sm:p-3 text-center border-r border-notion-border flex flex-col justify-center items-center">
                    <div class="text-[10px] sm:text-sm font-bold text-notion-text leading-tight">${info.short}</div>
                </div>`;
            });
            html += `</div>`;

            weekDays.forEach(d => {
                const dt = parseDateISO(d);
                const isSel = d === state.selectedDate;
                html += `<div class="grid grid-cols-[60px_repeat(${TIME_PERIODS.length},minmax(90px,1fr))] sm:grid-cols-[100px_repeat(${TIME_PERIODS.length},minmax(120px,1fr))] border-x border-b border-notion-border bg-white min-h-[90px]">
                    <div onclick="window.handleDateInput('${d}')" class="p-2 border-r border-notion-border flex flex-col justify-center items-center text-center cursor-pointer transition ${isSel ? 'bg-indigo-600 text-white' : 'bg-notion-sidebar hover:bg-notion-hover'}">
                        <span class="font-bold text-[10px] sm:text-base">${dt.getMonth()+1}/${dt.getDate()}</span>
                        <span class="font-bold text-[9px] sm:text-sm">(${DAY_NAMES[dt.getDay()]})</span>
                    </div>`;
                
                TIME_PERIODS.forEach(p => {
                    const cellRes = state.reservations.filter(r => r.date === d && r.periodId === p.id);
                    html += `<div class="p-1 sm:p-2 border-r border-notion-border flex flex-col gap-1.5 drop-zone h-full min-h-[90px]" ondragover="window.handleDragOver(event)" ondragenter="window.handleDragEnter(event)" ondragleave="window.handleDragLeave(event)" ondrop="window.handleDrop(event, null, '${d}', '${p.id}')">`;
                    
                    cellRes.forEach(res => {
                        const room = getRoomById(res.roomId);
                        const cat = getCategoryById(res.category);
                        const isMoving = state.movingReservationId === res.id;
                        html += `<div draggable="true" ondragstart="window.handleDragStart(event, '${res.id}')" ondragend="window.handleDragEnd(event)" onclick="window.handleSlotInteraction('${res.roomId}', '${d}', '${p.id}', '${res.id}')" class="w-full rounded border ${cat.border} bg-white shadow-2xs p-1.5 flex flex-col relative overflow-hidden group cursor-grab active:cursor-grabbing reservation-tile min-w-0 ${isMoving ? 'opacity-40 ring-2 ring-indigo-500' : ''}">
                            <div class="absolute top-0 left-0 bottom-0 w-1 ${cat.dot}"></div>
                            <div class="pl-2 flex flex-col min-w-0">
                                <div class="flex items-center justify-between mb-0.5 gap-1 min-w-0">
                                    <span class="text-[9px] sm:text-[10px] font-bold ${cat.text} bg-white/90 rounded leading-tight whitespace-nowrap shrink-0">${cat.label}</span>
                                    <span class="text-[9px] sm:text-[10px] font-bold text-indigo-700 bg-indigo-50 px-1 rounded whitespace-nowrap truncate min-w-0">【${formatShortRoomName(room.name)}】</span>
                                </div>
                                <div class="font-bold text-[10px] sm:text-xs text-notion-text truncate leading-tight w-full">${escapeHTML(res.user)}</div>
                            </div>
                        </div>`;
                    });

                    if (cellRes.length < state.rooms.length) {
                        html += `<button onclick="window.handleSlotInteraction(null, '${d}', '${p.id}', null)" class="w-full mt-auto min-h-[24px] rounded border border-dashed border-emerald-200 bg-emerald-50/30 hover:bg-emerald-50 transition flex items-center justify-center text-emerald-700">
                            <i class="ph-bold ph-plus text-[10px] sm:text-sm"></i>
                        </button>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            });
            document.getElementById('allRoomsWeeklyGrid').innerHTML = html;
        }

        function renderSlotTileHTML(room, dateStr, period, res) {
            const isMovingTarget = Boolean(state.movingReservationId);
            const dropAttrs = `ondragover="window.handleDragOver(event)" ondragenter="window.handleDragEnter(event)" ondragleave="window.handleDragLeave(event)" ondrop="window.handleDrop(event, '${room.id}', '${dateStr}', '${period.id}')"`;

            if (!res) {
                return `<div class="p-1 border-r border-notion-border flex drop-zone h-full min-w-0" ${dropAttrs}>
                    <button onclick="window.handleSlotInteraction('${room.id}', '${dateStr}', '${period.id}', null)" class="w-full h-full min-h-[70px] sm:min-h-[110px] rounded-md sm:rounded-lg border border-dashed border-emerald-200 bg-emerald-50/30 hover:bg-emerald-50 transition flex flex-col items-center justify-center group ${isMovingTarget ? 'move-target-pulse bg-indigo-50 border-indigo-300' : ''}">
                        <span class="text-[10px] sm:text-sm font-bold text-emerald-700 group-hover:scale-110 transition flex items-center gap-1">
                            <i class="ph-bold ${isMovingTarget ? 'ph-arrow-elbow-down-right' : 'ph-plus'} text-sm sm:text-base"></i><span class="hidden sm:inline">${isMovingTarget ? '移動' : '空き'}</span>
                        </span>
                    </button>
                </div>`;
            }
            
            const cat = getCategoryById(res.category);
            const isMoving = state.movingReservationId === res.id;

            return `<div class="p-1 border-r border-notion-border flex drop-zone h-full min-w-0" ${dropAttrs}>
                <div draggable="true" ondragstart="window.handleDragStart(event, '${res.id}')" ondragend="window.handleDragEnd(event)" onclick="window.handleSlotInteraction('${room.id}', '${dateStr}', '${period.id}', '${res.id}')" class="w-full h-full min-h-[70px] sm:min-h-[110px] rounded-md sm:rounded-lg border ${cat.border} bg-white shadow-2xs p-1.5 sm:p-2.5 flex flex-col relative overflow-hidden group cursor-grab active:cursor-grabbing reservation-tile min-w-0 ${isMoving ? 'opacity-40 ring-2 ring-indigo-500' : ''} ${isMovingTarget && !isMoving ? 'move-target-pulse' : ''}">
                    <div class="absolute top-0 left-0 right-0 h-1 sm:h-1.5 ${cat.dot}"></div>
                    <span class="text-[9px] sm:text-[11px] font-bold ${cat.text} bg-white/90 px-1 py-0.5 rounded w-fit mb-0.5 sm:mb-1 leading-tight shrink-0 mt-0.5 sm:mt-1 truncate max-w-full">${cat.label}</span>
                    <div class="font-bold text-[10px] sm:text-sm text-notion-text truncate leading-tight w-full">${escapeHTML(res.user)}</div>
                    ${res.title ? `<div class="text-[9px] sm:text-xs text-notion-muted truncate leading-tight mt-0.5 w-full">${escapeHTML(res.title)}</div>` : ''}
                    <button type="button" onclick="window.startTileMoveMode('${res.id}', event)" class="absolute bottom-1 right-1 p-1 sm:p-1.5 rounded-md bg-notion-sidebar text-notion-muted hover:text-indigo-600 transition shadow-2xs z-10" title="移動">
                        <i class="ph-bold ph-arrows-out-cardinal text-[10px] sm:text-sm"></i>
                    </button>
                </div>
            </div>`;
        }

        // ====== 月間カレンダー ======
        window.changeCalendarMonth = function(delta) {
            let m = state.calendarMonth + delta; let y = state.calendarYear;
            if (m > 11) { m = 0; y++; } else if (m < 0) { m = 11; y--; }
            state.calendarMonth = m; state.calendarYear = y; renderAll();
        };
        window.resetCalendarToCurrentMonth = function() {
            const now = new Date(); state.calendarMonth = now.getMonth(); state.calendarYear = now.getFullYear(); renderAll();
        };
        function renderCalendarView() {
            const y = state.calendarYear, m = state.calendarMonth;
            const heading = document.getElementById('calendarMonthHeading');
            if (heading) heading.textContent = `${y}年 ${m + 1}月`;
            const grid = document.getElementById('calendarDaysGrid');
            if (!grid) return;

            const firstDay = new Date(y, m, 1), lastDay = new Date(y, m + 1, 0);
            const startDow = firstDay.getDay(), daysInMonth = lastDay.getDate();

            let html = '';
            for (let i = 0; i < startDow; i++) html += `<div class="p-2 opacity-0 pointer-events-none"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const isoStr = formatDateISO(new Date(y, m, d));
                const isToday = isoStr === state.todayISO;
                const isSel = isoStr === state.selectedDate;
                const dayRes = state.reservations.filter(r => r.date === isoStr);
                
                html += `<div onclick="window.handleCalendarDayClick('${isoStr}')" class="p-2 sm:p-4 flex flex-col items-center justify-start rounded-xl border border-notion-border cursor-pointer transition ${isSel ? 'ring-2 ring-indigo-500 bg-indigo-50' : 'hover:bg-notion-hover bg-white'}">
                    <span class="text-xs sm:text-lg font-bold ${isToday ? 'bg-indigo-600 text-white w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center rounded-full' : 'text-notion-text'}">${d}</span>
                    ${dayRes.length > 0 ? `<div class="w-1.5 h-1.5 sm:w-2 sm:h-2 rounded-full bg-indigo-500 mt-1 mx-auto shadow-sm"></div>` : ''}
                    <span class="text-[9px] sm:text-xs font-bold text-notion-muted mt-1">${dayRes.length > 0 ? dayRes.length + '件' : '&nbsp;'}</span>
                </div>`;
            }
            grid.innerHTML = html;
            renderCalendarDayDetail();
        }
        window.handleCalendarDayClick = function(isoStr) { state.selectedDate = isoStr; renderAll(); };
        function renderCalendarDayDetail() {
            const c = document.getElementById('calendarMobileDayDetail');
            if (!c) return;
            const dayRes = state.reservations.filter(r => r.date === state.selectedDate);
            const dt = parseDateISO(state.selectedDate);
            let html = `<h4 class="font-bold text-base sm:text-lg mb-4 flex items-center gap-2"><i class="ph-bold ph-calendar-check text-indigo-600 text-xl"></i>${dt.getMonth()+1}月${dt.getDate()}日 の予約</h4>`;
            if (dayRes.length === 0) {
                html += `<p class="text-notion-muted text-xs sm:text-sm font-bold bg-notion-sidebar p-4 rounded-xl">予約はありません。</p>`;
            } else {
                html += `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3">`;
                dayRes.forEach(r => {
                    const room = getRoomById(r.roomId), period = getPeriodById(r.periodId), cat = getCategoryById(r.category);
                    html += `<div class="p-3 rounded-xl border border-notion-border flex flex-col gap-1 bg-white shadow-2xs cursor-pointer hover:bg-notion-hover" onclick="window.switchView('matrix')">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded ${cat.bg} ${cat.text}">${cat.label}</span>
                            <span class="text-[10px] font-bold text-notion-muted">${period.short}</span>
                        </div>
                        <div class="font-bold text-xs sm:text-sm text-notion-text truncate"><i class="ph-bold ${room.icon} mr-1 text-indigo-600"></i>${escapeHTML(room.name)}</div>
                        <div class="text-[10px] sm:text-xs font-bold text-notion-text truncate">${escapeHTML(r.user)}</div>
                    </div>`;
                });
                html += `</div>`;
            }
            c.innerHTML = html;
        }

        // ====== 予約モーダル ======
        function populatePeriodOptions(dateStr, selId) {
            const sel = document.getElementById('resFormPeriod');
            sel.innerHTML = TIME_PERIODS.map(p => `<option value="${p.id}">${getPeriodDisplayInfo(p, dateStr).label}</option>`).join('');
            if(selId) sel.value = selId;
        }
        window.handleModalDateOrPeriodChange = function() {
            populatePeriodOptions(document.getElementById('resFormDate').value, document.getElementById('resFormPeriod').value);
            window.checkFormConflictWarning();
        };
        window.toggleCustomTimeInputs = function() {
            const w = document.getElementById('customTimeInputsWrapper');
            if(document.getElementById('resFormUseCustomTime').checked) w.classList.remove('opacity-50', 'pointer-events-none');
            else w.classList.add('opacity-50', 'pointer-events-none');
        };
        window.setCategory = function(id) { state.selectedCategory = id; renderCategoryGroup(); };
        function renderCategoryGroup() {
            document.getElementById('resFormCategoryGroup').innerHTML = CATEGORIES.map(c => `
                <button type="button" onclick="window.setCategory('${c.id}')" class="py-2 px-1 rounded-lg border text-[10px] sm:text-xs font-bold flex flex-col items-center justify-center gap-1 transition-all ${state.selectedCategory===c.id ? `${c.bg} ${c.border} ${c.text} ring-2 ring-indigo-500 shadow-sm scale-105` : 'bg-white border-notion-border text-notion-muted hover:bg-notion-hover'}">
                    <span class="w-2.5 h-2.5 rounded-full ${c.dot}"></span>${c.label}
                </button>
            `).join('');
        }
        
        window.openReservationModal = function(opt = {}) {
            const m = document.getElementById('reservationModal');
            document.getElementById('resFormRoom').innerHTML = state.rooms.map(r => `<option value="${r.id}">${escapeHTML(r.name)}</option>`).join('');
            
            const res = opt.reservationId ? state.reservations.find(r=>r.id===opt.reservationId) : null;
            const targetDate = res ? res.date : (opt.date || state.selectedDate);
            populatePeriodOptions(targetDate);
            
            document.getElementById('resFormId').value = res ? res.id : '';
            document.getElementById('resFormRoom').value = res ? res.roomId : (opt.roomId || state.rooms[0].id);
            document.getElementById('resFormDate').value = targetDate;
            document.getElementById('resFormPeriod').value = res ? res.periodId : (opt.periodId || 'p1');
            state.selectedCategory = res ? res.category : 'class';
            document.getElementById('resFormUser').value = res ? res.user : '';
            document.getElementById('resFormTitle').value = res ? (res.title||'') : '';
            document.getElementById('resFormMemo').value = res ? (res.memo||'') : '';
            
            document.getElementById('btnDeleteReservation').classList.toggle('hidden', !res);
            document.getElementById('btnStartTouchMove').classList.toggle('hidden', !res);
            document.getElementById('btnSubmitReservationText').textContent = res ? '変更を保存' : '予約確定';
            
            renderCategoryGroup(); window.checkFormConflictWarning(); window.clearUserValidationError();
            m.classList.remove('hidden'); m.classList.add('flex');
        };
        window.closeReservationModal = function() { document.getElementById('reservationModal').classList.add('hidden'); document.getElementById('reservationModal').classList.remove('flex'); };
        
        window.fillUserPreset = function(txt) {
            const inp = document.getElementById('resFormUser');
            inp.value = inp.value ? `${inp.value} ${txt}` : txt;
            window.clearUserValidationError();
        };
        window.clearUserValidationError = function() { document.getElementById('resFormUser').classList.remove('border-rose-500'); document.getElementById('resFormUserError').classList.add('hidden'); };
        
        window.checkFormConflictWarning = function() {
            const r = document.getElementById('resFormRoom').value, d = document.getElementById('resFormDate').value, p = document.getElementById('resFormPeriod').value;
            const exist = findReservation(r, d, p);
            const ban = document.getElementById('resFormConflictBanner');
            if(exist && exist.id !== document.getElementById('resFormId').value) {
                ban.classList.remove('hidden'); document.getElementById('resFormConflictText').innerHTML = `既に予約（${escapeHTML(exist.user)}）があります。`;
            } else ban.classList.add('hidden');
        };

        // ====== Firebase データ保存・削除 ======
        window.saveReservationForm = function(e) {
            e.preventDefault();
            const id = document.getElementById('resFormId').value;
            const user = document.getElementById('resFormUser').value.trim();
            if(!user) { document.getElementById('resFormUser').classList.add('border-rose-500'); document.getElementById('resFormUserError').classList.remove('hidden'); return; }
            
            const rId = document.getElementById('resFormRoom').value;
            const dStr = document.getElementById('resFormDate').value;
            const pId = document.getElementById('resFormPeriod').value;
            
            // Swap check via form
            const exist = findReservation(rId, dStr, pId);
            if(exist && exist.id !== id) {
                 showToast('その枠には既に予約があります。上書き/移動できません。', 'error'); return;
            }
            
            const resData = {
                roomId: rId, date: dStr, periodId: pId, user: user, category: state.selectedCategory,
                title: document.getElementById('resFormTitle').value, memo: document.getElementById('resFormMemo').value
            };

            if(id) {
                set(ref(database, 'reservations/' + id), resData);
            } else {
                push(ref(database, 'reservations'), resData);
            }
            window.closeReservationModal(); showToast('予約を保存しました');
        };

        window.deleteCurrentReservation = function() {
            const id = document.getElementById('resFormId').value;
            if(id) {
                remove(ref(database, 'reservations/' + id));
                window.closeReservationModal(); showToast('予約を削除しました');
            }
        };

        function showToast(msg, type='success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `text-white px-5 py-3 rounded-xl shadow-lg text-sm sm:text-base font-bold transition-all ${type==='error'?'bg-rose-600':'bg-notion-text'}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        window.addEventListener('DOMContentLoaded', () => { renderAll(); });
    </script>
</body>
</html>
