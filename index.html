<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SchooRoom | 特別教室予約確認ボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        notion: {
                            bg: '#FBFBFA',
                            sidebar: '#F3F3F1',
                            border: '#E6E6E3',
                            text: '#2C2C2B',
                            muted: '#787774',
                            hover: '#EDEDEA'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        body {
            background-color: #FBFBFA;
            color: #2C2C2B;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            font-size: 1.05rem;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .reservation-tile {
            cursor: grab;
            transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
            user-select: none;
        }
        .reservation-tile:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.08);
        }
        .reservation-tile:active {
            cursor: grabbing;
        }
        .drop-zone {
            transition: background-color 0.12s ease, outline 0.12s ease;
        }
        .drop-zone.drag-over {
            background-color: rgba(79, 70, 229, 0.08) !important;
            outline: 2px dashed #4F46E5;
            outline-offset: -2px;
        }
        .move-target-pulse {
            animation: pulseBorder 1.5s infinite;
        }
        @keyframes pulseBorder {
            0%, 100% { border-color: #6366f1; background-color: rgba(99, 102, 241, 0.06); }
            50% { border-color: #4f46e5; background-color: rgba(99, 102, 241, 0.16); }
        }
        input[type="text"], input[type="time"], input[type="date"], select {
            font-size: 16px !important;
        }

        /* 12コマ均等フィットグリッド */
        .matrix-grid, .weekly-grid-row {
            display: grid;
            grid-template-columns: 62px repeat(12, minmax(0, 1fr));
            width: 100%;
        }
        @media (min-width: 768px) {
            .matrix-grid, .weekly-grid-row {
                grid-template-columns: 78px repeat(12, minmax(0, 1fr));
            }
        }
        .weekly-scroll-container {
            max-height: calc(100vh - 190px);
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
        }
        @media (max-width: 900px) {
            .weekly-scroll-container {
                overflow-x: auto;
            }
            .matrix-grid, .weekly-grid-row {
                min-width: 960px;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-24 md:pb-0 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-notion-border px-3 py-1.5 sm:px-6 sm:py-2 z-30">
        <div class="max-w-[1900px] mx-auto flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div class="flex items-center justify-between sm:justify-start gap-3">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-sm shrink-0">
                        <i class="ph-bold ph-squares-four text-base sm:text-lg"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] sm:text-xs font-bold text-indigo-600 tracking-wider">SchooRoom</span>
                        <h1 class="font-bold text-sm sm:text-lg tracking-tight text-notion-text flex items-center gap-2 flex-wrap leading-tight">
                            特別教室予約確認ボード
                            <span id="liveTodayBadge" class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 text-[10px] sm:text-xs font-semibold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>本日
                            </span>
                        </h1>
                    </div>
                </div>
                <div class="sm:hidden flex items-center gap-1 text-[10px] font-bold text-sky-600 px-2 py-0.5 rounded bg-sky-50 border border-sky-100" id="mobileCloudStatus">
                    <span class="w-1 h-1 rounded-full bg-sky-500 animate-pulse" id="mobileCloudDot"></span>通信中
                </div>
            </div>

            <div class="flex flex-wrap items-center gap-1 sm:gap-2 bg-notion-sidebar p-1 rounded-lg border border-notion-border justify-between sm:justify-start">
                <div class="flex items-center gap-1">
                    <button onclick="window.shiftSelectedDate(-1)" class="p-1 rounded-md hover:bg-white hover:shadow-2xs text-notion-text transition" title="前日へ">
                        <i class="ph-bold ph-caret-left text-base"></i>
                    </button>
                    <div class="relative flex items-center">
                        <input
                            type="date"
                            id="headerDatePicker"
                            onchange="window.handleDateInput(this.value)"
                            class="bg-transparent font-bold text-xs sm:text-sm px-1 py-0.5 rounded-md hover:bg-white focus:bg-white focus:outline-none cursor-pointer w-[110px] sm:w-[130px]"
                        />
                    </div>
                    <span id="selectedDayOfWeek" class="text-xs font-bold px-1.5 py-0.5 rounded-md bg-white border border-notion-border text-notion-text shrink-0"></span>
                    <button onclick="window.shiftSelectedDate(1)" class="p-1 rounded-md hover:bg-white hover:shadow-2xs text-notion-text transition" title="翌日へ">
                        <i class="ph-bold ph-caret-right text-base"></i>
                    </button>
                </div>
                <div class="flex items-center gap-1.5 ml-auto sm:ml-0">
                    <button onclick="window.jumpToToday()" id="btnJumpToday" class="px-2 py-1 text-xs font-semibold rounded-md bg-white border border-notion-border hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition shadow-2xs">
                        今日
                    </button>
                    <button
                        onclick="window.toggleDayScheduleMode()"
                        id="btnDayScheduleMode"
                        class="px-2 py-1 text-[10px] sm:text-xs font-bold rounded-md border transition flex items-center gap-1 shadow-2xs"
                    >
                        <i class="ph-bold ph-arrows-clockwise text-xs"></i>
                        <span id="dayScheduleModeLabel">6校時日課</span>
                    </button>
                </div>
            </div>

            <div class="hidden md:flex items-center gap-2">
                <div id="cloudStatusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-sky-50 border border-sky-200 text-sky-700 text-xs font-semibold transition-colors">
                    <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-sky-500 animate-pulse transition-colors"></span>
                    <span id="cloudStatusText">クラウド接続中...</span>
                </div>
                <button onclick="window.openAddRoomModal()" class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-lg bg-white border border-notion-border hover:bg-notion-hover text-notion-text transition shadow-2xs">
                    <i class="ph-bold ph-door-open text-indigo-600"></i>
                    <span>教室管理</span>
                </button>
            </div>
        </div>
    </header>

    <!-- デスクトップ用 タブナビゲーション -->
    <div class="bg-white border-b border-notion-border px-3 sm:px-6 py-1.5 hidden md:block z-20">
        <div class="max-w-[1900px] mx-auto flex items-center gap-1.5">
            <button onclick="window.switchView('weekly')" id="tab-weekly" class="view-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-calendar-week text-base"></i><span>週間表示</span>
            </button>
            <button onclick="window.switchView('matrix')" id="tab-matrix" class="view-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-grid-four text-base"></i><span>当日一覧</span>
            </button>
            <button onclick="window.switchView('calendar')" id="tab-calendar" class="view-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-calendar-blank text-base"></i><span>カレンダー</span>
            </button>
        </div>
    </div>

    <!-- 移動中バナー -->
    <div id="mobileMoveBanner" class="hidden sticky top-0 z-40 bg-indigo-600 text-white px-4 py-2 sm:px-6 sm:py-3 shadow-md">
        <div class="max-w-[1900px] mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-2 text-xs sm:text-sm font-bold min-w-0">
                <i class="ph-bold ph-arrows-out-cardinal text-lg animate-bounce shrink-0"></i>
                <span id="mobileMoveBannerText" class="truncate">移動先の空き枠をタップしてください</span>
            </div>
            <button onclick="window.cancelTileMoveMode()" class="px-3 py-1 rounded-md bg-white/20 hover:bg-white/30 text-white text-xs font-bold shrink-0 transition">
                キャンセル
            </button>
        </div>
    </div>

    <main class="flex-1 max-w-[1900px] w-full mx-auto px-2 sm:px-4 py-3 sm:py-5 space-y-4">
        <!-- VIEW: Weekly (全教室週間表示) -->
        <section id="view-weekly" class="space-y-3">
            <div class="bg-white rounded-xl border border-notion-border p-2 sm:p-4 shadow-2xs flex flex-col">
                <div class="flex items-center justify-between gap-2 mb-2 pb-2 border-b border-notion-border">
                    <h3 class="font-bold text-sm sm:text-base text-notion-text flex items-center gap-1.5">
                        <i class="ph-bold ph-calendar-week text-indigo-600"></i> 週間表示 (全教室)
                    </h3>
                    <div class="flex items-center gap-1.5">
                        <button onclick="window.shiftSelectedDate(-7)" class="px-2.5 py-1 text-xs font-semibold rounded-md border border-notion-border hover:bg-notion-hover bg-white">◀ 前週</button>
                        <button onclick="window.shiftSelectedDate(7)" class="px-2.5 py-1 text-xs font-semibold rounded-md border border-notion-border hover:bg-notion-hover bg-white">翌週 ▶</button>
                    </div>
                </div>
                <div class="weekly-scroll-container border border-notion-border rounded-lg bg-white">
                    <div id="allRoomsWeeklyGrid" class="w-full bg-white relative">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: Matrix (当日一覧) -->
        <section id="view-matrix" class="hidden space-y-3">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-white px-3 py-2 sm:px-4 rounded-xl border border-notion-border shadow-2xs">
                <div class="flex items-center gap-2">
                    <i class="ph-fill ph-sparkle text-indigo-600 text-lg"></i>
                    <h2 id="matrixDateHeading" class="font-bold text-sm sm:text-base flex items-center gap-2 flex-wrap"></h2>
                </div>
                <div class="flex flex-wrap items-center gap-1.5 text-[11px]">
                    <span class="px-2 py-0.5 rounded bg-blue-50 text-blue-700 font-bold border border-blue-200">授業</span>
                    <span class="px-2 py-0.5 rounded bg-orange-50 text-orange-700 font-bold border border-orange-200">部活動</span>
                    <span class="px-2 py-0.5 rounded bg-purple-50 text-purple-700 font-bold border border-purple-200">行事</span>
                    <span class="px-2 py-0.5 rounded bg-amber-50 text-amber-800 font-bold border border-amber-200">会議</span>
                    <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 font-bold border border-slate-300">その他</span>
                </div>
            </div>
            <div id="matrixTableWrapper" class="weekly-scroll-container bg-white rounded-xl border border-notion-border shadow-xs">
                <div id="matrixGridContainer" class="w-full bg-white relative">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

        <!-- VIEW: Calendar (月間カレンダー) -->
        <section id="view-calendar" class="hidden space-y-4">
            <div class="bg-white rounded-xl border border-notion-border p-3 sm:p-6 shadow-2xs">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <div class="flex items-center gap-3">
                        <h2 id="calendarMonthHeading" class="font-bold text-lg sm:text-2xl text-notion-text"></h2>
                        <div class="flex items-center gap-1 bg-notion-sidebar p-1 rounded-lg border border-notion-border">
                            <button onclick="window.changeCalendarMonth(-1)" class="p-1 rounded hover:bg-white text-xs font-bold"><i class="ph-bold ph-caret-left"></i></button>
                            <button onclick="window.resetCalendarToCurrentMonth()" class="px-2 py-1 rounded hover:bg-white text-xs font-bold">今月</button>
                            <button onclick="window.changeCalendarMonth(1)" class="p-1 rounded hover:bg-white text-xs font-bold"><i class="ph-bold ph-caret-right"></i></button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-notion-muted mb-2">
                    <div class="py-1 text-rose-600 bg-rose-50/60 rounded">日</div>
                    <div class="py-1 bg-notion-sidebar rounded">月</div>
                    <div class="py-1 bg-notion-sidebar rounded">火</div>
                    <div class="py-1 bg-notion-sidebar rounded">水</div>
                    <div class="py-1 bg-notion-sidebar rounded">木</div>
                    <div class="py-1 bg-notion-sidebar rounded">金</div>
                    <div class="py-1 text-sky-600 bg-sky-50/60 rounded">土</div>
                </div>

                <div id="calendarDaysGrid" class="grid grid-cols-7 gap-1">
                    <!-- Populated dynamically -->
                </div>

                <div id="calendarMobileDayDetail" class="mt-4 pt-4 border-t border-notion-border">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>
    </main>

    <!-- Mobile Fixed Bottom Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-notion-border px-1 py-1 flex items-center justify-around shadow-[0_-3px_12px_rgba(0,0,0,0.04)]">
        <button onclick="window.switchView('weekly')" id="mob-tab-weekly" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-calendar-week text-lg"></i><span>週間表示</span>
        </button>
        <button onclick="window.switchView('matrix')" id="mob-tab-matrix" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-grid-four text-lg"></i><span>当日一覧</span>
        </button>
        <button onclick="window.switchView('calendar')" id="mob-tab-calendar" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-calendar-blank text-lg"></i><span>カレンダー</span>
        </button>
        <button onclick="window.openReservationModal()" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold bg-indigo-600 text-white shadow-2xs transition w-1/4">
            <i class="ph-bold ph-plus-circle text-lg"></i><span>新規予約</span>
        </button>
    </nav>

    <!-- Reservation Modal -->
    <div id="reservationModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-3">
        <div class="bg-white rounded-2xl border border-notion-border shadow-2xl max-w-xl w-full flex flex-col max-h-[90vh] overflow-hidden relative">
            
            <div class="flex items-center justify-between px-4 py-3 border-b border-notion-border bg-notion-sidebar shrink-0">
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
                        <i class="ph-bold ph-calendar-plus text-base"></i>
                    </div>
                    <h3 id="reservationModalTitle" class="font-bold text-sm sm:text-base text-notion-text">特別教室を予約する</h3>
                </div>
                <button type="button" onclick="window.closeReservationModal()" class="p-1 rounded-lg text-notion-muted hover:text-notion-text hover:bg-white transition">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            </div>

            <!-- インライン削除確認バー -->
            <div id="inlineDeleteConfirm" class="hidden bg-rose-50 border-b border-rose-200 px-4 py-2.5 flex items-center justify-between gap-2 shrink-0 animate-fadeIn">
                <div class="flex items-center gap-2 text-rose-800 text-xs font-bold">
                    <i class="ph-fill ph-warning-circle text-base text-rose-600"></i>
                    <span>この予約を完全に削除しますか？</span>
                </div>
                <div class="flex items-center gap-2">
                    <button type="button" id="btnConfirmDeleteNo" class="px-2.5 py-1 text-xs font-bold rounded-md bg-white border border-rose-300 text-rose-800 hover:bg-rose-100">やめる</button>
                    <button type="button" id="btnConfirmDeleteYes" class="px-3 py-1 text-xs font-bold rounded-md bg-rose-600 text-white hover:bg-rose-700 shadow-2xs">削除する</button>
                </div>
            </div>

            <form id="reservationForm" onsubmit="window.saveReservationForm(event)" class="p-3 sm:p-5 space-y-4 overflow-y-auto overscroll-contain flex-1 no-scrollbar bg-white pb-24" novalidate>
                <input type="hidden" id="resFormId" />

                <!-- 教室・日付 -->
                <div class="bg-notion-sidebar/50 p-3 rounded-xl border border-notion-border space-y-2.5">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-notion-muted mb-1">特別教室 (会場)</label>
                            <select id="resFormRoom" required onchange="window.checkFormConflictWarning()" class="w-full px-2.5 py-1.5 rounded-lg border border-notion-border text-xs sm:text-sm font-bold bg-white focus:ring-2 focus:ring-indigo-500 truncate">
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-notion-muted mb-1">利用日</label>
                            <input type="date" id="resFormDate" required onchange="window.handleModalDateOrPeriodChange()" class="w-full px-2.5 py-1.5 rounded-lg border border-notion-border text-xs sm:text-sm font-bold bg-white focus:ring-2 focus:ring-indigo-500" />
                        </div>
                    </div>

                    <!-- 時間指定方法の切替 -->
                    <div class="pt-2 border-t border-notion-border/60">
                        <div class="flex items-center justify-between mb-1.5">
                            <label class="block text-xs font-bold text-notion-muted">利用時間帯の指定方法</label>
                            <div class="inline-flex p-0.5 rounded-lg bg-notion-sidebar border border-notion-border text-[11px]">
                                <button type="button" id="btnModePeriod" onclick="window.setTimeInputMode('period')" class="px-2 py-0.5 rounded-md font-bold bg-indigo-600 text-white shadow-2xs">コマ選択</button>
                                <button type="button" id="btnModeCustom" onclick="window.setTimeInputMode('custom')" class="px-2 py-0.5 rounded-md font-bold text-notion-muted hover:bg-white">時刻指定</button>
                            </div>
                        </div>

                        <!-- ① コマ範囲選択 -->
                        <div id="timeModePeriodSection" class="flex items-center gap-1.5">
                            <select id="resFormStartPeriod" onchange="window.handleModalDateOrPeriodChange()" class="flex-1 min-w-0 px-2 py-1.5 rounded-lg border border-notion-border text-xs font-bold bg-white focus:ring-2 focus:ring-indigo-500 truncate">
                            </select>
                            <span class="text-xs font-bold text-notion-muted">〜</span>
                            <select id="resFormEndPeriod" onchange="window.handleModalDateOrPeriodChange()" class="flex-1 min-w-0 px-2 py-1.5 rounded-lg border border-notion-border text-xs font-bold bg-white focus:ring-2 focus:ring-indigo-500 truncate">
                            </select>
                        </div>

                        <!-- ② 時刻直接指定 (時・分プルダウン) -->
                        <div id="timeModeCustomSection" class="hidden flex items-center gap-1.5 bg-white p-2 rounded-lg border border-notion-border">
                            <div class="flex items-center gap-1">
                                <select id="customStartHour" class="px-1.5 py-1 rounded border border-notion-border text-xs font-bold bg-white"></select>
                                <span class="text-xs font-bold">:</span>
                                <select id="customStartMin" class="px-1.5 py-1 rounded border border-notion-border text-xs font-bold bg-white"></select>
                            </div>
                            <span class="text-xs font-bold text-notion-muted">〜</span>
                            <div class="flex items-center gap-1">
                                <select id="customEndHour" class="px-1.5 py-1 rounded border border-notion-border text-xs font-bold bg-white"></select>
                                <span class="text-xs font-bold">:</span>
                                <select id="customEndMin" class="px-1.5 py-1 rounded border border-notion-border text-xs font-bold bg-white"></select>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="resFormConflictBanner" class="hidden p-2.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-800 text-xs flex items-start gap-1.5">
                    <i class="ph-fill ph-warning-circle text-base text-amber-600 shrink-0 mt-0.5"></i>
                    <div id="resFormConflictText"></div>
                </div>

                <!-- カテゴリー ＆ 予約者 -->
                <div class="rounded-xl border border-notion-border p-3 space-y-3">
                    <div>
                        <label class="text-xs font-bold text-notion-text mb-1.5 block">1. カテゴリーを選択</label>
                        <div id="resFormCategoryGroup" class="grid grid-cols-5 gap-1">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <div class="pt-2 border-t border-notion-border">
                        <label for="resFormUser" class="text-xs font-bold text-notion-text mb-1.5 flex items-center justify-between">
                            <span>2. だれが予約したか <span class="text-[10px] text-notion-muted font-normal">（学年・部活動など）</span></span>
                            <span class="text-[9px] px-1 py-0.5 rounded bg-rose-100 text-rose-700 font-bold">必須</span>
                        </label>
                        <input type="text" id="resFormUser" oninput="window.clearUserValidationError()" placeholder="例: 佐藤 / 2学年 / バスケ部" class="w-full px-2.5 py-2 rounded-lg border border-notion-border bg-white text-sm font-bold focus:ring-2 focus:ring-indigo-500 shadow-2xs" />
                        <p id="resFormUserError" class="hidden mt-1 text-[11px] font-bold text-rose-600">入力してください</p>
                        
                        <div class="flex flex-wrap items-center gap-1 mt-2">
