<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SchooRoom | 特別教室予約確認ボード</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                    },
                    colors: {
                        notion: {
                            bg: '#FBFBFA',
                            sidebar: '#F3F3F1',
                            border: '#E6E6E3',
                            text: '#2C2C2B',
                            muted: '#787774',
                            hover: '#EDEDEA'
                        }
                    }
                }
            }
        };
    </script>

    <style>
        body {
            background-color: #FBFBFA;
            color: #2C2C2B;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            font-size: 1.05rem;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .reservation-tile {
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            user-select: none;
        }
        .reservation-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.08);
        }
        .reservation-tile:active {
            cursor: grabbing;
        }
        .reservation-tile.dragging {
            opacity: 0.45;
            transform: scale(0.96);
        }
        .drop-zone {
            transition: background-color 0.15s ease, outline 0.15s ease;
        }
        .drop-zone.drag-over {
            background-color: rgba(79, 70, 229, 0.08) !important;
            outline: 2px dashed #4F46E5;
            outline-offset: -3px;
        }
        .move-target-pulse {
            animation: pulseBorder 1.5s infinite;
        }
        @keyframes pulseBorder {
            0%, 100% { border-color: #6366f1; background-color: rgba(99, 102, 241, 0.06); }
            50% { border-color: #4f46e5; background-color: rgba(99, 102, 241, 0.16); }
        }
        input[type="text"], input[type="time"], input[type="date"], select {
            font-size: 16px !important;
        }
        /* 12コマ対応マトリクス・週間グリッド */
        .matrix-grid {
            display: grid;
            grid-template-columns: 80px repeat(12, minmax(105px, 1fr));
        }
        @media (min-width: 640px) {
            .matrix-grid {
                grid-template-columns: 110px repeat(12, minmax(120px, 1fr));
            }
        }
        .weekly-grid-row {
            display: grid;
            grid-template-columns: 85px repeat(12, minmax(105px, 1fr));
        }
        @media (min-width: 640px) {
            .weekly-grid-row {
                grid-template-columns: 105px repeat(12, minmax(120px, 1fr));
            }
        }
        .weekly-scroll-container {
            max-height: calc(100vh - 220px);
            overflow-y: auto;
            overflow-x: auto;
        }
        @media (max-width: 640px) {
            .weekly-scroll-container {
                max-height: calc(100vh - 190px);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-20 md:pb-0 selection:bg-indigo-100 selection:text-indigo-900">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-notion-border px-3 py-2 sm:px-6 z-30 sticky top-0 shadow-2xs">
        <div class="max-w-[1900px] mx-auto flex flex-col md:flex-row md:items-center justify-between gap-2">
            <div class="flex items-center justify-between sm:justify-start gap-3">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-indigo-600 text-white flex items-center justify-center shadow-sm shrink-0">
                        <i class="ph-bold ph-squares-four text-lg sm:text-xl"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-[10px] sm:text-xs font-bold text-indigo-600 tracking-wider">SchooRoom</span>
                        <h1 class="font-bold text-sm sm:text-xl tracking-tight text-notion-text flex items-center gap-2 flex-wrap leading-tight">
                            特別教室予約確認ボード
                            <span id="liveTodayBadge" class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 text-[10px] sm:text-xs font-semibold rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>本日
                            </span>
                        </h1>
                    </div>
                </div>
                <div class="sm:hidden flex items-center gap-1 text-[10px] font-bold text-sky-600 px-2 py-0.5 rounded bg-sky-50 border border-sky-100" id="mobileCloudStatus">
                    <span class="w-1 h-1 rounded-full bg-sky-500 animate-pulse" id="mobileCloudDot"></span>通信中
                </div>
            </div>

            <!-- Date Picker & Controls -->
            <div class="flex flex-wrap items-center gap-1 sm:gap-3 bg-notion-sidebar p-1 sm:p-2 rounded-lg border border-notion-border justify-between sm:justify-start">
                <div class="flex items-center gap-1">
                    <button onclick="window.shiftSelectedDate(-1)" class="p-1 sm:p-2 rounded-md hover:bg-white hover:shadow-sm text-notion-text transition" title="前日へ">
                        <i class="ph-bold ph-caret-left text-base sm:text-xl"></i>
                    </button>
                    <div class="relative flex items-center">
                        <input
                            type="date"
                            id="headerDatePicker"
                            onchange="window.handleDateInput(this.value)"
                            class="bg-transparent font-bold text-sm sm:text-base px-1 py-0.5 sm:px-2 sm:py-1 rounded-md hover:bg-white focus:bg-white focus:outline-none cursor-pointer w-[120px] sm:w-[140px]"
                        />
                    </div>
                    <span id="selectedDayOfWeek" class="text-xs sm:text-sm font-bold px-1.5 py-0.5 sm:px-2 sm:py-1 rounded-md bg-white border border-notion-border text-notion-text shrink-0"></span>
                    <button onclick="window.shiftSelectedDate(1)" class="p-1 sm:p-2 rounded-md hover:bg-white hover:shadow-sm text-notion-text transition" title="翌日へ">
                        <i class="ph-bold ph-caret-right text-base sm:text-xl"></i>
                    </button>
                </div>
                <div class="flex items-center gap-1 sm:gap-2 ml-auto sm:ml-0">
                    <button onclick="window.jumpToToday()" id="btnJumpToday" class="px-2 py-1 sm:px-3 sm:py-1.5 text-xs sm:text-sm font-semibold rounded-md bg-white border border-notion-border hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition shadow-2xs">
                        今日
                    </button>
                    <button
                        onclick="window.toggleDayScheduleMode()"
                        id="btnDayScheduleMode"
                        class="px-2 py-1 sm:px-3 sm:py-1.5 text-[11px] sm:text-sm font-bold rounded-md border transition flex items-center gap-1 shadow-2xs"
                    >
                        <i class="ph-bold ph-arrows-clockwise text-xs sm:text-base"></i>
                        <span id="dayScheduleModeLabel">6校時日課</span>
                    </button>
                </div>
            </div>

            <!-- Action Buttons (Desktop Only) -->
            <div class="hidden md:flex items-center gap-2">
                <div id="cloudStatusBadge" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-sky-50 border border-sky-200 text-sky-700 text-xs font-semibold transition-colors">
                    <span id="cloudStatusDot" class="w-2 h-2 rounded-full bg-sky-500 animate-pulse transition-colors"></span>
                    <span id="cloudStatusText">クラウド接続中...</span>
                </div>
                <button onclick="window.openAddRoomModal()" class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-white border border-notion-border hover:bg-notion-hover text-notion-text transition shadow-2xs">
                    <i class="ph-bold ph-door-open text-indigo-600 text-sm"></i>
                    <span>教室管理</span>
                </button>
            </div>
        </div>
    </header>

    <!-- デスクトップ用 タブナビゲーション -->
    <div class="bg-white border-b border-notion-border px-4 sm:px-6 py-2 hidden md:block z-20 sticky top-[57px] shadow-2xs">
        <div class="max-w-[1900px] mx-auto flex items-center gap-2">
            <button onclick="window.switchView('weekly')" id="tab-weekly" class="view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-calendar-week text-lg"></i><span>週間表示</span>
            </button>
            <button onclick="window.switchView('matrix')" id="tab-matrix" class="view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-grid-four text-lg"></i><span>当日一覧</span>
            </button>
            <button onclick="window.switchView('calendar')" id="tab-calendar" class="view-tab flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-semibold transition whitespace-nowrap">
                <i class="ph-bold ph-calendar-blank text-lg"></i><span>カレンダー</span>
            </button>
        </div>
    </div>

    <!-- 移動モードのバナー -->
    <div id="mobileMoveBanner" class="hidden sticky top-0 z-40 bg-indigo-600 text-white px-4 py-3 sm:px-6 sm:py-4 shadow-md">
        <div class="max-w-[1900px] mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 text-sm sm:text-base font-bold min-w-0">
                <i class="ph-bold ph-arrows-out-cardinal text-xl sm:text-2xl animate-bounce shrink-0"></i>
                <span id="mobileMoveBannerText" class="truncate">移動先の空き枠（または入替枠）をタップ</span>
            </div>
            <button onclick="window.cancelTileMoveMode()" class="px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg bg-white/20 hover:bg-white/30 text-white text-xs sm:text-sm font-bold shrink-0 transition">
                キャンセル
            </button>
        </div>
    </div>

    <main class="flex-1 max-w-[1900px] w-full mx-auto px-2 sm:px-8 py-3 sm:py-6 space-y-4">

        <!-- VIEW: Weekly (全教室週間表示) -->
        <section id="view-weekly" class="space-y-4">
            <div class="bg-white rounded-xl sm:rounded-2xl border border-notion-border p-3 sm:p-5 shadow-2xs flex flex-col">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-3 pb-3 border-b border-notion-border">
                    <div class="flex items-center gap-2 sm:gap-3">
                        <h3 class="font-bold text-base sm:text-2xl text-notion-text flex items-center gap-2">
                            <i class="ph-bold ph-calendar-week text-indigo-600"></i> 週間表示 (全教室)
                        </h3>
                        <span class="text-xs text-notion-muted font-bold" id="weeklyRangeLabel"></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="window.shiftSelectedDate(-7)" class="px-2.5 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-bold rounded-lg border border-notion-border hover:bg-notion-hover bg-white flex items-center gap-1 shadow-2xs">
                            <i class="ph-bold ph-caret-left"></i> 前週
                        </button>
                        <button onclick="window.shiftSelectedDate(7)" class="px-2.5 py-1.5 sm:px-4 sm:py-2 text-xs sm:text-sm font-bold rounded-lg border border-notion-border hover:bg-notion-hover bg-white flex items-center gap-1 shadow-2xs">
                            翌週 <i class="ph-bold ph-caret-right"></i>
                        </button>
                    </div>
                </div>

                <div class="weekly-scroll-container border border-notion-border rounded-xl shadow-inner bg-white">
                    <div id="allRoomsWeeklyGrid" class="min-w-[1350px] bg-white relative">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </section>

        <!-- VIEW: Matrix (当日一覧) -->
        <section id="view-matrix" class="hidden space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white px-4 py-3 sm:px-6 rounded-xl border border-notion-border shadow-2xs">
                <div class="flex items-center gap-3">
                    <i class="ph-fill ph-sparkle text-indigo-600 text-xl"></i>
                    <h2 id="matrixDateHeading" class="font-bold text-base sm:text-xl flex items-center gap-3 flex-wrap"></h2>
                </div>
                <div class="flex flex-wrap items-center gap-2 text-xs">
                    <span class="px-2.5 py-1 rounded-md bg-blue-50 text-blue-700 font-bold border border-blue-200">授業</span>
                    <span class="px-2.5 py-1 rounded-md bg-orange-50 text-orange-700 font-bold border border-orange-200">部活動</span>
                    <span class="px-2.5 py-1 rounded-md bg-purple-50 text-purple-700 font-bold border border-purple-200">行事</span>
                    <span class="px-2.5 py-1 rounded-md bg-amber-50 text-amber-800 font-bold border border-amber-200">会議</span>
                    <span class="px-2.5 py-1 rounded-md bg-slate-100 text-slate-700 font-bold border border-slate-300">その他</span>
                </div>
            </div>
            <div id="matrixTableWrapper" class="weekly-scroll-container bg-white rounded-xl border border-notion-border shadow-xs">
                <div id="matrixGridContainer" class="w-full min-w-[1350px] bg-white relative">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

        <!-- VIEW: Calendar (月間カレンダー) -->
        <section id="view-calendar" class="hidden space-y-4">
            <div class="bg-white rounded-xl sm:rounded-2xl border border-notion-border p-4 sm:p-6 shadow-2xs">
                <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
                    <div class="flex items-center gap-3 sm:gap-6">
                        <h2 id="calendarMonthHeading" class="font-bold text-xl sm:text-3xl text-notion-text"></h2>
                        <div class="flex items-center gap-1 bg-notion-sidebar p-1 rounded-lg border border-notion-border">
                            <button onclick="window.changeCalendarMonth(-1)" class="p-1.5 sm:p-2 rounded-md hover:bg-white text-sm font-bold"><i class="ph-bold ph-caret-left"></i></button>
                            <button onclick="window.resetCalendarToCurrentMonth()" class="px-2.5 py-1 rounded-md hover:bg-white text-xs sm:text-sm font-bold">今月</button>
                            <button onclick="window.changeCalendarMonth(1)" class="p-1.5 sm:p-2 rounded-md hover:bg-white text-sm font-bold"><i class="ph-bold ph-caret-right"></i></button>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-7 gap-1 sm:gap-2 text-center text-xs sm:text-sm font-bold text-notion-muted mb-2">
                    <div class="py-2 text-rose-600 bg-rose-50/60 rounded-md">日</div>
                    <div class="py-2 bg-notion-sidebar rounded-md">月</div>
                    <div class="py-2 bg-notion-sidebar rounded-md">火</div>
                    <div class="py-2 bg-notion-sidebar rounded-md">水</div>
                    <div class="py-2 bg-notion-sidebar rounded-md">木</div>
                    <div class="py-2 bg-notion-sidebar rounded-md">金</div>
                    <div class="py-2 text-sky-600 bg-sky-50/60 rounded-md">土</div>
                </div>

                <div id="calendarDaysGrid" class="grid grid-cols-7 gap-1 sm:gap-2">
                    <!-- Populated dynamically -->
                </div>

                <div id="calendarMobileDayDetail" class="mt-6 pt-6 border-t border-notion-border">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </section>

    </main>

    <!-- Mobile Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-notion-border px-2 py-1.5 flex items-center justify-around shadow-[0_-4px_15px_rgba(0,0,0,0.05)]">
        <button onclick="window.switchView('weekly')" id="mob-tab-weekly" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-calendar-week text-xl"></i><span>週間表示</span>
        </button>
        <button onclick="window.switchView('matrix')" id="mob-tab-matrix" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-grid-four text-xl"></i><span>当日一覧</span>
        </button>
        <button onclick="window.switchView('calendar')" id="mob-tab-calendar" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold transition w-1/4">
            <i class="ph-bold ph-calendar-blank text-xl"></i><span>カレンダー</span>
        </button>
        <button onclick="window.openReservationModal()" class="flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold bg-indigo-600 text-white shadow-xs transition w-1/4">
            <i class="ph-bold ph-plus-circle text-xl"></i><span>新規予約</span>
        </button>
    </nav>

    <!-- Reservation Modal -->
    <div id="reservationModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-sm p-3 sm:p-4">
        <div class="bg-white rounded-2xl sm:rounded-3xl border border-notion-border shadow-2xl max-w-2xl w-full flex flex-col max-h-[88vh] relative overflow-hidden">
            
            <div class="flex items-center justify-between px-5 py-3.5 sm:py-4 border-b border-notion-border bg-notion-sidebar shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
                        <i class="ph-bold ph-calendar-plus text-lg"></i>
                    </div>
                    <h3 id="reservationModalTitle" class="font-bold text-base sm:text-lg text-notion-text">特別教室を予約する</h3>
                </div>
                <button type="button" onclick="window.closeReservationModal()" class="p-1 rounded-lg text-notion-muted hover:text-notion-text hover:bg-white transition">
                    <i class="ph-bold ph-x text-xl"></i>
                </button>
            </div>

            <!-- インライン削除確認バー -->
            <div id="deleteConfirmBar" class="hidden bg-rose-50 border-b border-rose-200 p-3 sm:px-5 flex items-center justify-between gap-3 text-rose-900 shrink-0">
                <div class="flex items-center gap-2 text-xs sm:text-sm font-bold">
                    <i class="ph-fill ph-warning-circle text-rose-600 text-lg"></i>
                    <span>この予約を完全に削除しますか？</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                    <button type="button" id="btnCancelDelete" class="px-2.5 py-1 text-xs font-bold rounded-md bg-white border border-rose-300 hover:bg-rose-100 text-rose-700">やめる</button>
                    <button type="button" id="btnConfirmDelete" class="px-3 py-1 text-xs font-bold rounded-md bg-rose-600 hover:bg-rose-700 text-white shadow-xs">削除する</button>
                </div>
            </div>

            <form id="reservationForm" onsubmit="window.saveReservationForm(event)" class="p-4 sm:p-6 space-y-4 overflow-y-auto overscroll-contain flex-1 bg-white pb-28 sm:pb-28" novalidate>
                <input type="hidden" id="resFormId" />

                <!-- Step 1: 教室・日付 -->
                <div class="space-y-3 bg-notion-sidebar/60 p-3 sm:p-4 rounded-xl border border-notion-border">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-notion-muted mb-1">特別教室 (会場) <span class="text-rose-500">*</span></label>
                            <select id="resFormRoom" required onchange="window.checkFormConflictWarning()" class="w-full px-2.5 py-2 rounded-lg border border-notion-border text-sm font-bold bg-white focus:ring-2 focus:ring-indigo-500">
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-notion-muted mb-1">利用日 <span class="text-rose-500">*</span></label>
                            <input type="date" id="resFormDate" required onchange="window.handleModalDateOrPeriodChange()" class="w-full px-2.5 py-2 rounded-lg border border-notion-border text-sm font-bold bg-white focus:ring-2 focus:ring-indigo-500" />
                        </div>
                    </div>
                    
                    <!-- 時間指定モードの切り替えタブ -->
                    <div class="pt-2 border-t border-notion-border/70">
                        <label class="block text-xs font-bold text-notion-muted mb-1.5">時間帯の指定方法</label>
                        <div class="grid grid-cols-2 gap-2 p-1 bg-white rounded-lg border border-notion-border">
                            <button type="button" id="modeBtnSlot" onclick="window.setTimeMode('slot')" class="py-1.5 text-xs font-bold rounded-md bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-2xs flex items-center justify-center gap-1">
                                <i class="ph-bold ph-calendar-check"></i> ① コマから選ぶ
                            </button>
                            <button type="button" id="modeBtnExact" onclick="window.setTimeMode('exact')" class="py-1.5 text-xs font-bold rounded-md text-notion-muted hover:bg-notion-sidebar flex items-center justify-center gap-1">
                                <i class="ph-bold ph-clock"></i> ② 時間を直接指定
                            </button>
                        </div>
                    </div>

                    <!-- パターン①：コマ範囲選択 (開始時刻のみ / 終了時刻のみ) -->
                    <div id="containerSlotMode" class="space-y-1.5">
                        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-1.5 sm:gap-2">
                            <div class="flex-1 min-w-0">
                                <label class="block text-[11px] font-bold text-notion-muted mb-0.5">開始コマ</label>
                                <select id="resFormStartSlot" required onchange="window.handleModalDateOrPeriodChange()" class="w-full px-2.5 py-2 rounded-lg border border-notion-border text-xs sm:text-sm font-bold bg-white focus:ring-2 focus:ring-indigo-500 truncate">
                                </select>
                            </div>
                            <span class="text-xs font-bold text-notion-muted text-center shrink-0 self-center mt-3">〜</span>
                            <div class="flex-1 min-w-0">
                                <label class="block text-[11px] font-bold text-notion-muted mb-0.5">終了コマ</label>
                                <select id="resFormEndSlot" required onchange="window.handleModalDateOrPeriodChange()" class="w-full px-2.5 py-2 rounded-lg border border-notion-border text-xs sm:text-sm font-bold bg-white focus:ring-2 focus:ring-indigo-500 truncate">
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- パターン②：時・分プルダウン直接指定 -->
                    <div id="containerExactMode" class="hidden space-y-2 bg-white p-3 rounded-lg border border-indigo-100">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
                            <!-- 開始時刻 -->
                            <div>
                                <label class="block text-[11px] font-bold text-indigo-700 mb-1">開始時刻</label>
                                <div class="flex items-center gap-1">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 sm:bottom-8 sm:right-8 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- 🌟 Firebase 設定 ＆ アプリロジック 🌟 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOUoCFaseKszQ9-yO6cb87IOJImQL-_uw",
            authDomain: "schooroom-ddcdd.firebaseapp.com",
            databaseURL: "https://schooroom-ddcdd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "schooroom-ddcdd",
            storageBucket: "schooroom-ddcdd.firebasestorage.app",
            messagingSenderId: "163341369660",
            appId: "1:163341369660:web:16ee8234c8c74b506c1e39"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

        // 🌟 12コマ定義（早朝・朝学活・中休み追加） 🌟
        const TIME_PERIODS = [
            { id: 'p_early', label: '早朝',           time: '07:30 - 08:15', startOnly: '07:30〜', endOnly: '〜08:15', short: '早朝',   startMin: 7*60+30, endMin: 8*60+15 },
            { id: 'p_morn',  label: '朝学活',         time: '08:15 - 08:40', startOnly: '08:15〜', endOnly: '〜08:40', short: '朝学活', startMin: 8*60+15, endMin: 8*60+40 },
            { id: 'p1',      label: '1校時',          time: '08:50 - 09:40', startOnly: '08:50〜', endOnly: '〜09:40', short: '1校時',  startMin: 8*60+50, endMin: 9*60+40 },
            { id: 'p2',      label: '2校時',          time: '09:50 - 10:40', startOnly: '09:50〜', endOnly: '〜10:40', short: '2校時',  startMin: 9*60+50, endMin: 10*60+40 },
            { id: 'p_break', label: '休み時間',       time: '10:40 - 10:55', startOnly: '10:40〜', endOnly: '〜10:55', short: '休み',   startMin: 10*60+40, endMin: 10*60+55 },
            { id: 'p3',      label: '3校時',          time: '10:55 - 11:45', startOnly: '10:55〜', endOnly: '〜11:45', short: '3校時',  startMin: 10*60+55, endMin: 11*60+45 },
            { id: 'p4',      label: '4校時',          time: '11:55 - 12:45', startOnly: '11:55〜', endOnly: '〜12:45', short: '4校時',  startMin: 11*60+55, endMin: 12*60+45 },
            { id: 'lunch',   label: '昼休み',         time: '12:45 - 13:35', startOnly: '12:45〜', endOnly: '〜13:35', short: '昼休',   startMin: 12*60+45, endMin: 13*60+35 },
            { id: 'p5',      label: '5校時',          time: '13:40 - 14:30', startOnly: '13:40〜', endOnly: '〜14:30', short: '5校時',  startMin: 13*60+40, endMin: 14*60+30 },
            { id: 'p6',      label: '6校時',          time: '14:40 - 15:30', startOnly: '14:40〜', endOnly: '〜15:30', short: '6校時',  label5Period: '放課後(5限後)', time5Period: '14:40 - 15:30', startMin: 14*60+40, endMin: 15*60+30 },
            { id: 'after1',  label: '放課後(〜16:30)', time: '15:30 - 16:30', startOnly: '15:30〜', endOnly: '〜16:30', short: '〜16:30', startMin: 15*60+30, endMin: 16*60+30 },
            { id: 'after2',  label: '16:30以降(フリー)', time: '16:30〜 時間自由', startOnly: '16:30〜', endOnly: '〜18:30', short: '16:30〜', startMin: 16*60+30, endMin: 18*60+30, isFreeSlot: true }
        ];

        const CATEGORIES = [
            { id: 'class',     label: '授業',        bg: 'bg-blue-50',   border: 'border-blue-200',   text: 'text-blue-800',   dot: 'bg-blue-500' },
            { id: 'club',      label: '部活動',      bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-800', dot: 'bg-orange-500' },
            { id: 'event',     label: '行事・集会',  bg: 'bg-purple-50', border: 'border-purple-200', text: 'text-purple-800', dot: 'bg-purple-500' },
            { id: 'committee', label: '会議',        bg: 'bg-amber-50',  border: 'border-amber-200',  text: 'text-amber-900',  dot: 'bg-amber-500' },
            { id: 'other',     label: 'その他',      bg: 'bg-slate-100', border: 'border-slate-300',  text: 'text-slate-800',  dot: 'bg-slate-500' }
        ];

        const ROOM_COLOR_MAP = {
            orange:  { badgeBg: 'bg-orange-100',  badgeText: 'text-orange-700' },
            amber:   { badgeBg: 'bg-amber-100',   badgeText: 'text-amber-800' },
            emerald: { badgeBg: 'bg-emerald-100', badgeText: 'text-emerald-700' },
            violet:  { badgeBg: 'bg-violet-100',  badgeText: 'text-violet-700' },
            pink:    { badgeBg: 'bg-pink-100',    badgeText: 'text-pink-700' },
            sky:     { badgeBg: 'bg-sky-100',     badgeText: 'text-sky-700' },
            indigo:  { badgeBg: 'bg-indigo-100',  badgeText: 'text-indigo-700' },
            teal:    { badgeBg: 'bg-teal-100',    badgeText: 'text-teal-700' }
        };

        const DEFAULT_ROOMS = [
            { id: 'gym',      name: '体育館',   icon: 'ph-basketball',         color: 'orange' },
            { id: 'martial',  name: '柔剣道場', icon: 'ph-shield-chevron',     color: 'amber' },
            { id: 'multi',    name: '多目的室', icon: 'ph-presentation-chart', color: 'emerald' },
            { id: 'music1',   name: '1音',      icon: 'ph-music-notes',        color: 'violet' },
            { id: 'music2',   name: '2音',      icon: 'ph-piano-keys',         color: 'pink' },
            { id: 'lounge',   name: '談話室',   icon: 'ph-chats-circle',       color: 'sky' },
            { id: 'meeting',  name: '会議室',   icon: 'ph-users-three',        color: 'indigo' }
        ];

        function formatDateISO(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        function parseDateISO(isoStr) { const [y, m, d] = isoStr.split('-').map(Number); return new Date(y, m - 1, d); }
        function addDaysISO(isoStr, days) { const dt = parseDateISO(isoStr); dt.setDate(dt.getDate() + days); return formatDateISO(dt); }
        function formatJapaneseDateLabel(isoStr) { const dt = parseDateISO(isoStr); return `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日（${DAY_NAMES[dt.getDay()]}）`; }
        function escapeHTML(str) { return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]) : ''; }
        function formatShortRoomName(name) {
            const map = { '体育館':'体育館', '柔剣道場':'柔剣道', '多目的室':'多目的', '1音':'1音', '2音':'2音', '談話室':'談話室', '会議室':'会議室' };
            return map[name] || (name.length > 3 ? name.substring(0, 3) : name);
        }

        const state = {
            todayISO: formatDateISO(new Date()),
            selectedDate: formatDateISO(new Date()),
            currentView: 'weekly',
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            selectedCategory: 'class',
            draggedReservationId: null,
            movingReservationId: null,
            timeInputMode: 'slot', // 'slot' or 'exact'
            dayScheduleModes: {},
            rooms: JSON.parse(JSON.stringify(DEFAULT_ROOMS)),
            reservations: []
        };

        function cleanupOldReservations() {
            const currentToday = state.todayISO;
            const oldIdsToDelete = [];
            state.reservations.forEach(res => {
                if (res.date < currentToday) oldIdsToDelete.push(res.id);
            });
            oldIdsToDelete.forEach(id => remove(ref(database, 'reservations/' + id)));
            if (oldIdsToDelete.length > 0) {
                state.reservations = state.reservations.filter(res => !oldIdsToDelete.includes(res.id));
            }
        }

        function checkAndHandleDateChange() {
            const nowISO = formatDateISO(new Date());
            if (nowISO !== state.todayISO) {
                const wasViewingToday = (state.selectedDate === state.todayISO);
                state.todayISO = nowISO;
                if (wasViewingToday) state.selectedDate = nowISO;
                const now = new Date();
                state.calendarYear = now.getFullYear();
                state.calendarMonth = now.getMonth();
                cleanupOldReservations();
                renderAll();
                showToast(`日付が更新されました（${now.getMonth()+1}/${now.getDate()}）`, 'info');
            }
        }
        setInterval(checkAndHandleDateChange, 60000);
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkAndHandleDateChange(); });
        window.addEventListener('focus', checkAndHandleDateChange);

        let hasCheckedForOldData = false;
        let isInitialLoad = true;

        onValue(ref(database, 'reservations'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state.reservations = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            } else {
                state.reservations = [];
            }

            if (!hasCheckedForOldData && data) {
                hasCheckedForOldData = true;
                cleanupOldReservations();
            }
            renderAll();

            if (isInitialLoad) {
                isInitialLoad = false;
                document.getElementById('cloudStatusText').textContent = '同期完了 (共有中)';
                const dot = document.getElementById('cloudStatusDot');
                dot.classList.remove('bg-sky-500'); dot.classList.add('bg-emerald-500');
                const badge = document.getElementById('cloudStatusBadge');
                badge.classList.replace('bg-sky-50', 'bg-emerald-50');
                badge.classList.replace('border-sky-200', 'border-emerald-200');
                badge.classList.replace('text-sky-700', 'text-emerald-700');
                const mDot = document.getElementById('mobileCloudDot');
                mDot.classList.remove('bg-sky-500'); mDot.classList.add('bg-emerald-500');
                const mBadge = document.getElementById('mobileCloudStatus');
                mBadge.classList.replace('bg-sky-50', 'bg-emerald-50');
                mBadge.classList.replace('border-sky-100', 'border-emerald-200');
                mBadge.classList.replace('text-sky-600', 'text-emerald-700');
                mBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>同期済`;
            }
        });

        function getDayScheduleMode(dateStr) { return state.dayScheduleModes[dateStr] || '6period'; }
        function getPeriodDisplayInfo(p, dateStr) {
            if (getDayScheduleMode(dateStr) === '5period' && p.id === 'p6') {
                return { label: p.label5Period || '放課後(5限後)', time: p.time5Period || '14:40 - 15:30', short: '5限後' };
            }
            return { label: p.label, time: p.time, short: p.short };
        }
        function getRoomById(id) { return state.rooms.find(r => r.id === id) || state.rooms[0]; }
        function getPeriodById(id) { return TIME_PERIODS.find(p => p.id === id) || TIME_PERIODS[0]; }
        function getCategoryById(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }

        function isReservationInPeriod(res, periodId) {
            const startId = res.startSlot || res.startPeriodId || res.periodId || 'p1';
            const endId = res.endSlot || res.endPeriodId || res.startSlot || res.periodId || 'p1';
            const sIdx = TIME_PERIODS.findIndex(p => p.id === startId);
            const eIdx = TIME_PERIODS.findIndex(p => p.id === endId);
            const curIdx = TIME_PERIODS.findIndex(p => p.id === periodId);
            if (sIdx === -1 || curIdx === -1) return false;
            const minIdx = Math.min(sIdx, eIdx === -1 ? sIdx : eIdx);
            const maxIdx = Math.max(sIdx, eIdx === -1 ? sIdx : eIdx);
            return curIdx >= minIdx && curIdx <= maxIdx;
        }

        function findReservation(r, d, p) {
            return state.reservations.find(res => res.roomId === r && res.date === d && isReservationInPeriod(res, p));
        }

        window.shiftSelectedDate = function(delta) { state.selectedDate = addDaysISO(state.selectedDate, delta); renderAll(); };
        window.handleDateInput = function(val) { if(val) { state.selectedDate = val; renderAll(); } };
        window.jumpToToday = function() { state.selectedDate = state.todayISO; renderAll(); };
        window.switchView = function(viewName) { state.currentView = viewName; renderAll(); };
        window.toggleDayScheduleMode = function() {
            const currentMode = getDayScheduleMode(state.selectedDate);
            state.dayScheduleModes[state.selectedDate] = currentMode === '6period' ? '5period' : '6period';
            renderAll();
            showToast(`${parseDateISO(state.selectedDate).getMonth()+1}/${parseDateISO(state.selectedDate).getDate()} を「${state.dayScheduleModes[state.selectedDate] === '5period' ? '5校時日課' : '6校時日課'}」に変更しました`, 'info');
        };
        window.openAddRoomModal = function() { showToast('教室管理機能は現在準備中です', 'info'); };

        function renderAll() {
            renderHeaderControls();
            renderMoveBanner();
            ['matrix', 'weekly', 'calendar'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) el.classList.toggle('hidden', v !== state.currentView);
            });
            if (state.currentView === 'matrix') renderMatrixView();
            else if (state.currentView === 'weekly') renderWeeklyView();
            else if (state.currentView === 'calendar') renderCalendarView();
        }

        function renderHeaderControls() {
            document.getElementById('headerDatePicker').value = state.selectedDate;
            document.getElementById('selectedDayOfWeek').textContent = `${DAY_NAMES[parseDateISO(state.selectedDate).getDay()]}曜日`;

            const liveBadge = document.getElementById('liveTodayBadge');
            if (liveBadge) {
                liveBadge.classList.toggle('sm:inline-flex', state.selectedDate === state.todayISO);
                liveBadge.classList.toggle('hidden', state.selectedDate !== state.todayISO);
            }

            const modeBtn = document.getElementById('btnDayScheduleMode');
            const modeLabel = document.getElementById('dayScheduleModeLabel');
            if (getDayScheduleMode(state.selectedDate) === '5period') {
                modeBtn.className = 'px-2 py-1 sm:px-3 sm:py-1.5 text-[11px] sm:text-sm font-bold rounded-md bg-amber-50 text-amber-800 border border-amber-300 flex items-center gap-1 shadow-2xs';
                modeLabel.textContent = '5校時日課';
            } else {

        window.startTileMoveMode = function(id, e) {
            if (e) e.stopPropagation();
            state.movingReservationId = id;
            renderAll();
            showToast('移動先の枠をタップしてください', 'info');
        };
        window.triggerMoveFromModal = function() {
            const id = document.getElementById('resFormId').value;
            window.closeReservationModal();
            window.startTileMoveMode(id);
        };

        window.executeReservationMove = function(dragId, targetR, targetD, targetP) {
            const dragRes = state.reservations.find(r => r.id === dragId);
            if (!dragRes) return;
            const destRoomId = targetR && targetR !== 'null' ? targetR : dragRes.roomId;
            const existRes = findReservation(destRoomId, targetD, targetP);
            
            const curStartSlot = dragRes.startSlot || dragRes.startPeriodId || dragRes.periodId;
            const curEndSlot = dragRes.endSlot || dragRes.endPeriodId || curStartSlot;
            const curStartIdx = TIME_PERIODS.findIndex(p => p.id === curStartSlot);
            const curEndIdx = TIME_PERIODS.findIndex(p => p.id === curEndSlot);
            const duration = Math.max(0, curEndIdx - curStartIdx);
            
            const targetStartIdx = TIME_PERIODS.findIndex(p => p.id === targetP);
            const targetEndIdx = Math.min(TIME_PERIODS.length - 1, targetStartIdx + duration);

            const newStartSlot = TIME_PERIODS[targetStartIdx].id;
            const newEndSlot = TIME_PERIODS[targetEndIdx].id;

            if (existRes && existRes.id !== dragId) {
                set(ref(database, 'reservations/' + existRes.id), {
                    ...existRes,
                    roomId: dragRes.roomId,
                    date: dragRes.date,
                    startSlot: curStartSlot,
                    endSlot: curEndSlot,
                    periodId: curStartSlot
                });
            }
            set(ref(database, 'reservations/' + dragId), {
                ...dragRes,
                roomId: destRoomId,
                date: targetD,
                startSlot: newStartSlot,
                endSlot: newEndSlot,
                periodId: newStartSlot
            });

            state.movingReservationId = null;
            showToast('予約を移動しました');
        };

        window.handleDragStart = function(e, id) {
            e.dataTransfer.setData('text/plain', id);
            e.dataTransfer.effectAllowed = 'move';
            state.draggedReservationId = id;
            setTimeout(() => e.target.classList.add('opacity-50', 'scale-95'), 0);
        };
        window.handleDragEnd = function(e) {
            e.target.classList.remove('opacity-50', 'scale-95');
            state.draggedReservationId = null;
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        };
        window.handleDragOver = function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
        window.handleDragEnter = function(e) { e.preventDefault(); const zone = e.target.closest('.drop-zone'); if (zone) zone.classList.add('drag-over'); };
        window.handleDragLeave = function(e) { const zone = e.target.closest('.drop-zone'); if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); };
        window.handleDrop = function(e, targetR, targetD, targetP) {
            e.preventDefault();
            const zone = e.target.closest('.drop-zone');
            if (zone) zone.classList.remove('drag-over');
            const dragId = e.dataTransfer.getData('text/plain') || state.draggedReservationId;
            if (dragId) window.executeReservationMove(dragId, targetR, targetD, targetP);
        };
        
        window.handleSlotInteraction = function(r, d, p, existId = null) {
            if (state.movingReservationId) return window.executeReservationMove(state.movingReservationId, r, d, p);
            
            if (existId && existId !== 'null') {

                window.openReservationModal({ roomId: r && r !== 'null' ? r : state.rooms[0].id, date: d, periodId: p });

            hEnd.innerHTML = hourOpts;

            let minOpts = '';
            for (let m = 0; m < 60; m += 5) {
                const mStr = String(m).padStart(2, '0');
                minOpts += `<option value="${m}">${mStr}</option>`;
            }
            mStart.innerHTML = minOpts;
            mEnd.innerHTML = minOpts;
        }

        // 時刻プルダウン変更時
        window.handleExactTimeChange = function() {
            const sH = parseInt(document.getElementById('resFormStartHour').value, 10);
            const sM = parseInt(document.getElementById('resFormStartMin').value, 10);
            const eH = parseInt(document.getElementById('resFormEndHour').value, 10);
            const eM = parseInt(document.getElementById('resFormEndMin').value, 10);
            const startTotal = sH * 60 + sM;
            const endTotal = eH * 60 + eM;

            if (endTotal <= startTotal) {
                // 自動で1時間後に設定
                const newEndH = Math.min(20, sH + 1);
                document.getElementById('resFormEndHour').value = newEndH;
                document.getElementById('resFormEndMin').value = sM;
            }
            window.checkFormConflictWarning();
        };

        // 🌟 プルダウン：開始は「開始時刻のみ」、終了は「終了時刻のみ」を反映 🌟
        function populatePeriodOptions(dateStr, selStartId, selEndId) {
            const startSel = document.getElementById('resFormStartSlot');
            const endSel = document.getElementById('resFormEndSlot');

            const startOptionsHTML = TIME_PERIODS.map(p => {
                const info = getPeriodDisplayInfo(p, dateStr);
                return `<option value="${p.id}">${escapeHTML(info.label)}（${escapeHTML(p.startOnly)}）</option>`;
            }).join('');

            const endOptionsHTML = TIME_PERIODS.map(p => {
                const info = getPeriodDisplayInfo(p, dateStr);
                return `<option value="${p.id}">${escapeHTML(info.label)}（${escapeHTML(p.endOnly)}）</option>`;
            }).join('');

            startSel.innerHTML = startOptionsHTML;
            endSel.innerHTML = endOptionsHTML;

            if (selStartId) startSel.value = selStartId;
            if (selEndId) endSel.value = selEndId;
        }

        window.handleModalDateOrPeriodChange = function() {
            const dateVal = document.getElementById('resFormDate').value;
            const startVal = document.getElementById('resFormStartSlot').value;
            const endVal = document.getElementById('resFormEndSlot').value;
            populatePeriodOptions(dateVal, startVal, endVal);
            window.checkFormConflictWarning();
        };

        window.setCategory = function(id) { state.selectedCategory = id; renderCategoryGroup(); };
        function renderCategoryGroup() {
            document.getElementById('resFormCategoryGroup').innerHTML = CATEGORIES.map(c => `
                <button type="button" onclick="window.setCategory('${c.id}')" class="py-1.5 px-1 rounded-lg border text-[10px] sm:text-xs font-bold flex flex-col items-center justify-center gap-1 transition-all ${state.selectedCategory===c.id ? `${c.bg} ${c.border} ${c.text} ring-2 ring-indigo-500 shadow-sm scale-105` : 'bg-white border-notion-border text-notion-muted hover:bg-notion-hover'}">
                    <span class="w-2 h-2 rounded-full ${c.dot}"></span>${c.label}
                </button>
            `).join('');
        }
        
        window.openReservationModal = function(opt = {}) {
            const m = document.getElementById('reservationModal');
            document.getElementById('resFormRoom').innerHTML = state.rooms.map(r => `<option value="${r.id}">${escapeHTML(r.name)}</option>`).join('');
            
            hideDeleteConfirm();

            const res = opt.reservationId ? state.reservations.find(r => r.id === opt.reservationId) : null;
            const targetDate = res ? res.date : (opt.date || state.selectedDate);
            const defaultSlot = opt.periodId || 'p1';

            const startSlot = res ? (res.startSlot || res.startPeriodId || res.periodId) : defaultSlot;
            const endSlot = res ? (res.endSlot || res.endPeriodId || res.startSlot || res.periodId) : defaultSlot;

            populatePeriodOptions(targetDate, startSlot, endSlot);
            initExactTimeSelects();

            // 時刻指定モードの初期化
            if (res && res.exactTime) {
                window.setTimeMode('exact');
                document.getElementById('resFormStartHour').value = res.exactTime.startH;
                document.getElementById('resFormStartMin').value = res.exactTime.startM;
                document.getElementById('resFormEndHour').value = res.exactTime.endH;
                document.getElementById('resFormEndMin').value = res.exactTime.endM;
            } else {
                window.setTimeMode('slot');
                const pObj = getPeriodById(startSlot);
                const sH = Math.floor(pObj.startMin / 60);
                const sM = pObj.startMin % 60;
                const eH = Math.floor(pObj.endMin / 60);
                const eM = pObj.endMin % 60;
                document.getElementById('resFormStartHour').value = sH;
                document.getElementById('resFormStartMin').value = sM - (sM % 5);
                document.getElementById('resFormEndHour').value = eH;
                document.getElementById('resFormEndMin').value = eM - (eM % 5);
            }
            
            document.getElementById('resFormId').value = res ? res.id : '';
            document.getElementById('resFormRoom').value = res ? res.roomId : (opt.roomId || state.rooms[0].id);
            document.getElementById('resFormDate').value = targetDate;
            state.selectedCategory = res ? res.category : 'class';
            document.getElementById('resFormUser').value = res ? res.user : '';
            document.getElementById('resFormTitle').value = res ? (res.title || '') : '';
            document.getElementById('resFormMemo').value = res ? (res.memo || '') : '';
            
            const btnDel = document.getElementById('btnDeleteReservation');
            const btnMove = document.getElementById('btnStartTouchMove');
            
            if (res) {
                btnDel.classList.remove('hidden');
                btnMove.classList.remove('hidden');
                document.getElementById('btnSubmitReservationText').textContent = '変更を保存';
            } else {
                btnDel.classList.add('hidden');
                btnMove.classList.add('hidden');
                document.getElementById('btnSubmitReservationText').textContent = '予約確定';
            }
            
            renderCategoryGroup(); 
            window.checkFormConflictWarning(); 
            window.clearUserValidationError();
            m.classList.remove('hidden'); 
            m.classList.add('flex');
        };

        window.closeReservationModal = function() { 
            const m = document.getElementById('reservationModal');
            m.classList.add('hidden'); 
            m.classList.remove('flex'); 
            hideDeleteConfirm();
        };
        
        window.fillUserPreset = function(txt) {
            const inp = document.getElementById('resFormUser');
            inp.value = inp.value ? `${inp.value} ${txt}` : txt;
            window.clearUserValidationError();
        };
        window.clearUserValidationError = function() { 
            document.getElementById('resFormUser').classList.remove('border-rose-500'); 
            document.getElementById('resFormUserError').classList.add('hidden'); 
        };

        // 予約のコマ範囲を判定するヘルパー
        function getComputedSlotRange() {
            if (state.timeInputMode === 'exact') {
                const sH = parseInt(document.getElementById('resFormStartHour').value, 10);
                const sM = parseInt(document.getElementById('resFormStartMin').value, 10);
                const eH = parseInt(document.getElementById('resFormEndHour').value, 10);
                const eM = parseInt(document.getElementById('resFormEndMin').value, 10);
                const reqStart = sH * 60 + sM;
                const reqEnd = eH * 60 + eM;

                const covered = TIME_PERIODS.filter(p => !(reqEnd <= p.startMin || reqStart >= p.endMin));
                if (covered.length === 0) return { startSlot: 'p1', endSlot: 'p1', sIdx: 2, eIdx: 2, exactTimeLabel: `${String(sH).padStart(2,'0')}:${String(sM).padStart(2,'0')}〜${String(eH).padStart(2,'0')}:${String(eM).padStart(2,'0')}` };
                
                const startSlot = covered[0].id;
                const endSlot = covered[covered.length - 1].id;
                const sIdx = TIME_PERIODS.findIndex(p => p.id === startSlot);
                const eIdx = TIME_PERIODS.findIndex(p => p.id === endSlot);
                return {
                    startSlot,
                    endSlot,
                    sIdx,
                    eIdx,
                    exactTime: { startH: sH, startM: sM, endH: eH, endM: eM },
                    exactTimeLabel: `${String(sH).padStart(2,'0')}:${String(sM).padStart(2,'0')}〜${String(eH).padStart(2,'0')}:${String(eM).padStart(2,'0')}`
                };
            } else {
                const startSlot = document.getElementById('resFormStartSlot').value;
                const endSlot = document.getElementById('resFormEndSlot').value;
                const sIdx = TIME_PERIODS.findIndex(p => p.id === startSlot);
                const eIdx = TIME_PERIODS.findIndex(p => p.id === endSlot);
                return {
                    startSlot,
                    endSlot,
                    sIdx,
                    eIdx,
                    exactTime: null,
                    exactTimeLabel: null
                };
            }
        }
        
        window.checkFormConflictWarning = function() {
            const r = document.getElementById('resFormRoom').value;
            const d = document.getElementById('resFormDate').value;
            const range = getComputedSlotRange();
            const minIdx = Math.min(range.sIdx, range.eIdx);
            const maxIdx = Math.max(range.sIdx, range.eIdx);
            const id = document.getElementById('resFormId').value;

            let conflictRes = null;
            for (let i = minIdx; i <= maxIdx; i++) {
                const pId = TIME_PERIODS[i].id;
                const exist = findReservation(r, d, pId);
                if (exist && exist.id !== id) {
                    conflictRes = exist;
                    break;
                }
            }

            const ban = document.getElementById('resFormConflictBanner');
            if (conflictRes) {
                ban.classList.remove('hidden'); 
                document.getElementById('resFormConflictText').innerHTML = `選択範囲に既に予約（${escapeHTML(conflictRes.user)}）が含まれています。`;
            } else {
                ban.classList.add('hidden');
            }
        };

        window.saveReservationForm = function(e) {
            e.preventDefault();
            const id = document.getElementById('resFormId').value;
            const user = document.getElementById('resFormUser').value.trim();
            if (!user) { 
                document.getElementById('resFormUser').classList.add('border-rose-500'); 
                document.getElementById('resFormUserError').classList.remove('hidden'); 
                return; 
            }
            
            const rId = document.getElementById('resFormRoom').value;
            const dStr = document.getElementById('resFormDate').value;
            const range = getComputedSlotRange();

            if (range.eIdx < range.sIdx) {
                showToast('終了コマは、開始コマ以降を選択してください', 'error');
                return;
            }
            
            for (let i = range.sIdx; i <= range.eIdx; i++) {
                const exist = findReservation(rId, dStr, TIME_PERIODS[i].id);
                if (exist && exist.id !== id) {
                    showToast(`選択した範囲（${TIME_PERIODS[i].short}）に既に予約（${exist.user}）があります`, 'error');
                    return;
                }
            }
            
            const resData = {
                roomId: rId,
                date: dStr,
                startSlot: range.startSlot,
                endSlot: range.endSlot,
                periodId: range.startSlot,
                exactTime: range.exactTime || null,
                exactTimeLabel: range.exactTimeLabel || null,
                user: user,
                category: state.selectedCategory,
                title: document.getElementById('resFormTitle').value,
                memo: document.getElementById('resFormMemo').value
            };

            if (id) {
                set(ref(database, 'reservations/' + id), resData);
            } else {
                push(ref(database, 'reservations'), resData);
            }
            window.closeReservationModal(); 
            showToast('予約を保存しました');
        };

        function showDeleteConfirm() {
            document.getElementById('deleteConfirmBar').classList.remove('hidden');
        }
        function hideDeleteConfirm() {
            document.getElementById('deleteConfirmBar').classList.add('hidden');
        }

        const btnDelete = document.getElementById('btnDeleteReservation');
        const btnCancelDelete = document.getElementById('btnCancelDelete');
        const btnConfirmDelete = document.getElementById('btnConfirmDelete');

        btnDelete.addEventListener('click', (e) => { e.preventDefault(); showDeleteConfirm(); });
        btnCancelDelete.addEventListener('click', (e) => { e.preventDefault(); hideDeleteConfirm(); });

        btnConfirmDelete.addEventListener('click', async (e) => {
            e.preventDefault();
            const id = document.getElementById('resFormId').value;
            if (!id) return;

            try {
                await remove(ref(database, 'reservations/' + id));
                state.reservations = state.reservations.filter(r => r.id !== id);
                window.closeReservationModal();
                showToast('予約を削除しました');
                renderAll();
            } catch (err) {
                console.error('削除失敗:', err);
                showToast('削除に失敗しました。通信環境を確認してください。', 'error');
            }
        });

        function showToast(msg, type='success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `text-white px-4 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm font-bold transition-all ${type==='error'?'bg-rose-600':(type==='info'?'bg-indigo-600':'bg-notion-text')}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        window.addEventListener('DOMContentLoaded', () => { renderAll(); });
    </script>
</body>
</html>
