    <!-- 🌟 Firebase 設定 ＆ アプリロジック 🌟 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
        import { getDatabase, ref, onValue, set, remove, push } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBOUoCFaseKszQ9-yO6cb87IOJImQL-_uw",
            authDomain: "schooroom-ddcdd.firebaseapp.com",
            databaseURL: "https://schooroom-ddcdd-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "schooroom-ddcdd",
            storageBucket: "schooroom-ddcdd.firebasestorage.app",
            messagingSenderId: "163341369660",
            appId: "1:163341369660:web:16ee8234c8c74b506c1e39"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];
        const TIME_PERIODS = [
            { id: 'p0',     label: '早朝',              time: '〜 08:15',       short: '早朝',  defaultStart: '07:30', defaultEnd: '08:15' },
            { id: 'p_morn', label: '朝学活',            time: '08:15 - 08:40',  short: '朝学活', defaultStart: '08:15', defaultEnd: '08:40' },
            { id: 'p1',     label: '1校時',             time: '08:50 - 09:40',  short: '1校時', defaultStart: '08:50', defaultEnd: '09:40' },
            { id: 'p2',     label: '2校時',             time: '09:50 - 10:40',  short: '2校時', defaultStart: '09:50', defaultEnd: '10:40' },
            { id: 'p_break',label: '休み時間',          time: '10:40 - 10:55',  short: '休み',  defaultStart: '10:40', defaultEnd: '10:55' },
            { id: 'p3',     label: '3校時',             time: '10:55 - 11:45',  short: '3校時', defaultStart: '10:55', defaultEnd: '11:45' },
            { id: 'p4',     label: '4校時',             time: '11:55 - 12:45',  short: '4校時', defaultStart: '11:55', defaultEnd: '12:45' },
            { id: 'lunch',  label: '昼休み',            time: '12:45 - 13:35',  short: '昼休',  defaultStart: '12:45', defaultEnd: '13:35' },
            { id: 'p5',     label: '5校時',             time: '13:40 - 14:30',  short: '5校時', defaultStart: '13:40', defaultEnd: '14:30' },
            { id: 'p6',     label: '6校時',             time: '14:40 - 15:30',  short: '6校時', defaultStart: '14:40', defaultEnd: '15:30', label5Period: '放課後(5限後)', time5Period: '14:40 - 15:30' },
            { id: 'after1', label: '放課後(〜16:30)',   time: '15:30 - 16:30',  short: '〜16:30',defaultStart: '15:30', defaultEnd: '16:30' },
            { id: 'after2', label: '16:30以降(フリー)', time: '16:30〜 時間自由',short: '16:30〜',defaultStart: '16:30', defaultEnd: '18:00', isFreeSlot: true }
        ];

        const CATEGORIES = [
            { id: 'class',     label: '授業',        bg: 'bg-blue-50',   border: 'border-blue-200',   text: 'text-blue-800',   dot: 'bg-blue-500' },
            { id: 'club',      label: '部活動',      bg: 'bg-orange-50', border: 'border-orange-200', text: 'text-orange-800', dot: 'bg-orange-500' },
            { id: 'event',     label: '行事・集会',  bg: 'bg-purple-50', border: 'border-purple-200', text: 'text-purple-800', dot: 'bg-purple-500' },
            { id: 'committee', label: '会議',        bg: 'bg-amber-50',  border: 'border-amber-200',  text: 'text-amber-900',  dot: 'bg-amber-500' },
            { id: 'other',     label: 'その他',      bg: 'bg-slate-100', border: 'border-slate-300',  text: 'text-slate-800',  dot: 'bg-slate-500' }
        ];

        const ROOM_COLOR_MAP = {
            orange:  { badgeBg: 'bg-orange-100',  badgeText: 'text-orange-700' },
            amber:   { badgeBg: 'bg-amber-100',   badgeText: 'text-amber-800' },
            emerald: { badgeBg: 'bg-emerald-100', badgeText: 'text-emerald-700' },
            violet:  { badgeBg: 'bg-violet-100',  badgeText: 'text-violet-700' },
            pink:    { badgeBg: 'bg-pink-100',    badgeText: 'text-pink-700' },
            sky:     { badgeBg: 'bg-sky-100',     badgeText: 'text-sky-700' },
            indigo:  { badgeBg: 'bg-indigo-100',  badgeText: 'text-indigo-700' },
            teal:    { badgeBg: 'bg-teal-100',    badgeText: 'text-teal-700' }
        };

        // 指定の標準順序（多目的、体育館、談話室、会議室、柔剣道場、1音、2音）
        const DEFAULT_ROOMS = [
            { id: 'multi',    name: '多目的室', icon: 'ph-presentation-chart', color: 'emerald' },
            { id: 'gym',      name: '体育館',   icon: 'ph-basketball',         color: 'orange' },
            { id: 'lounge',   name: '談話室',   icon: 'ph-chats-circle',       color: 'sky' },
            { id: 'meeting',  name: '会議室',   icon: 'ph-users-three',        color: 'indigo' },
            { id: 'martial',  name: '柔剣道場', icon: 'ph-shield-chevron',     color: 'amber' },
            { id: 'music1',   name: '1音',      icon: 'ph-music-notes',        color: 'violet' },
            { id: 'music2',   name: '2音',      icon: 'ph-piano-keys',         color: 'pink' }
        ];

        function formatDateISO(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        function parseDateISO(isoStr) { const [y, m, d] = isoStr.split('-').map(Number); return new Date(y, m - 1, d); }
        function addDaysISO(isoStr, days) { const dt = parseDateISO(isoStr); dt.setDate(dt.getDate() + days); return formatDateISO(dt); }
        function formatJapaneseDateLabel(isoStr) { const dt = parseDateISO(isoStr); return `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日（${DAY_NAMES[dt.getDay()]}）`; }
        function escapeHTML(str) { return str ? String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]) : ''; }
        function formatShortRoomName(name) {
            const map = { '多目的室':'多目的', '体育館':'体育館', '談話室':'談話室', '会議室':'会議室', '柔剣道場':'柔剣道', '1音':'1音', '2音':'2音' };
            return map[name] || (name.length > 3 ? name.substring(0, 3) : name);
        }

        const todayISO = formatDateISO(new Date());

        const state = {
            todayISO: todayISO,
            selectedDate: todayISO,
            currentView: 'weekly',
            calendarYear: new Date().getFullYear(),
            calendarMonth: new Date().getMonth(),
            selectedCategory: 'class',
            draggedReservationId: null,
            movingReservationId: null,
            dayScheduleModes: {},
            rooms: JSON.parse(JSON.stringify(DEFAULT_ROOMS)),
            reservations: []
        };

        let hasCheckedForOldData = false;
        let isInitialLoad = true;

        // 教室並び順のFirebase同期
        onValue(ref(database, 'roomsConfig'), (snapshot) => {
            const data = snapshot.val();
            if (data && Array.isArray(data) && data.length > 0) {
                state.rooms = data;
            } else {
                state.rooms = JSON.parse(JSON.stringify(DEFAULT_ROOMS));
            }
            renderAll();
        });

        onValue(ref(database, 'reservations'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state.reservations = Object.keys(data).map(key => ({ id: key, ...data[key] }));
            } else {
                state.reservations = [];
            }

            if (!hasCheckedForOldData && data) {
                hasCheckedForOldData = true;
                cleanOldReservations();
            }
            
            renderAll();

            if (isInitialLoad) {
                isInitialLoad = false;
                const cloudText = document.getElementById('cloudStatusText');
                if (cloudText) cloudText.textContent = '同期完了 (共有中)';
                const dot = document.getElementById('cloudStatusDot');
                if (dot) {
                    dot.classList.remove('bg-sky-500');
                    dot.classList.add('bg-emerald-500');
                }
                const badge = document.getElementById('cloudStatusBadge');
                if (badge) {
                    badge.classList.replace('bg-sky-50', 'bg-emerald-50');
                    badge.classList.replace('border-sky-200', 'border-emerald-200');
                    badge.classList.replace('text-sky-700', 'text-emerald-700');
                }
                const mDot = document.getElementById('mobileCloudDot');
                if (mDot) {
                    mDot.classList.remove('bg-sky-500');
                    mDot.classList.add('bg-emerald-500');
                }
                const mBadge = document.getElementById('mobileCloudStatus');
                if (mBadge) {
                    mBadge.classList.replace('bg-sky-50', 'bg-emerald-50');
                    mBadge.classList.replace('border-sky-100', 'border-emerald-200');
                    mBadge.classList.replace('text-sky-600', 'text-emerald-700');
                    mBadge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>同期済`;
                }
            }
        });

        function cleanOldReservations() {
            const oldIdsToDelete = [];
            state.reservations.forEach(res => {
                if (res.date < state.todayISO) oldIdsToDelete.push(res.id);
            });
            oldIdsToDelete.forEach(id => {
                remove(ref(database, 'reservations/' + id));
            });
            if (oldIdsToDelete.length > 0) {
                state.reservations = state.reservations.filter(res => !oldIdsToDelete.includes(res.id));
            }
        }

        function checkAndHandleDateChange() {
            const currentRealToday = formatDateISO(new Date());
            if (currentRealToday !== state.todayISO) {
                const wasViewingToday = (state.selectedDate === state.todayISO);
                state.todayISO = currentRealToday;
                if (wasViewingToday) {
                    state.selectedDate = currentRealToday;
                }
                cleanOldReservations();
                renderAll();
                showToast(`日付が更新されました（${formatJapaneseDateLabel(currentRealToday)}）`, 'info');
            }
        }
        setInterval(checkAndHandleDateChange, 60000);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) checkAndHandleDateChange();
        });
        window.addEventListener('focus', checkAndHandleDateChange);

        function getDayScheduleMode(dateStr) { return state.dayScheduleModes[dateStr] || '6period'; }
        function getPeriodDisplayInfo(p, dateStr) {
            if (getDayScheduleMode(dateStr) === '5period' && p.id === 'p6') {
                return { label: p.label5Period || '放課後(5限後)', time: p.time5Period || '14:40 - 15:30', short: '5限後' };
            }
            return { label: p.label, time: p.time, short: p.short };
        }
        function getRoomById(id) { return state.rooms.find(r => r.id === id) || state.rooms[0]; }
        function getPeriodById(id) { return TIME_PERIODS.find(p => p.id === id) || TIME_PERIODS[0]; }
        function getCategoryById(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES[0]; }

        function isReservationInPeriod(res, periodId) {
            const pIdx = TIME_PERIODS.findIndex(p => p.id === periodId);
            if (pIdx === -1) return false;
            const startIdx = TIME_PERIODS.findIndex(p => p.id === (res.startPeriodId || res.periodId));
            const endIdx = TIME_PERIODS.findIndex(p => p.id === (res.endPeriodId || res.periodId));
            if (startIdx === -1 || endIdx === -1) return res.periodId === periodId;
            return pIdx >= startIdx && pIdx <= endIdx;
        }

        window.shiftSelectedDate = function(delta) { state.selectedDate = addDaysISO(state.selectedDate, delta); renderAll(); };
        window.handleDateInput = function(val) { if(val) { state.selectedDate = val; renderAll(); } };
        window.jumpToToday = function() { state.selectedDate = state.todayISO; renderAll(); };
        window.switchView = function(viewName) { state.currentView = viewName; renderAll(); };
        window.toggleDayScheduleMode = function() {
            const currentMode = getDayScheduleMode(state.selectedDate);
            state.dayScheduleModes[state.selectedDate] = currentMode === '6period' ? '5period' : '6period';
            renderAll();
            showToast(`${parseDateISO(state.selectedDate).getMonth()+1}/${parseDateISO(state.selectedDate).getDate()} を「${state.dayScheduleModes[state.selectedDate] === '5period' ? '5校時日課' : '6校時日課'}」に変更しました`, 'info');
        };

        window.openAddRoomModal = function() {
            const m = document.getElementById('roomManageModal');
            renderRoomManageList();
            m.classList.remove('hidden');
            m.classList.add('flex');
        };
        window.closeRoomManageModal = function() {
            const m = document.getElementById('roomManageModal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        };

        // 教室編集中のインデックス保持
        let editingRoomIndex = null;
        let deletingRoomIndex = null;

        // 教室一覧の描画（編集・削除インライン対応・並び替え）
        function renderRoomManageList() {
            const listEl = document.getElementById('roomManageList');
            if (!listEl) return;
            listEl.innerHTML = state.rooms.map((room, index) => {
                const theme = ROOM_COLOR_MAP[room.color] || ROOM_COLOR_MAP.indigo;

                // 削除確認中のインライン表示
                if (deletingRoomIndex === index) {
                    return `
                        <div class="flex items-center justify-between p-2 rounded-xl bg-rose-50 border border-rose-200 shadow-2xs animate-fadeIn">
                            <span class="text-xs font-bold text-rose-800">「${escapeHTML(room.name)}」を削除？</span>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="window.cancelDeleteRoom()" class="px-2 py-1 text-[11px] font-bold rounded bg-white border border-rose-300 text-rose-700 hover:bg-rose-100">やめる</button>
                                <button type="button" onclick="window.confirmDeleteRoom(${index})" class="px-2.5 py-1 text-[11px] font-bold rounded bg-rose-600 text-white hover:bg-rose-700 shadow-2xs">削除</button>
                            </div>
                        </div>
                    `;
                }

                // 編集中のインラインフォーム
                if (editingRoomIndex === index) {
                    return `
                        <div class="p-2.5 rounded-xl bg-indigo-50/60 border border-indigo-200 shadow-2xs space-y-2">
                            <div class="flex items-center gap-2">
                                <input type="text" id="editRoomName_${index}" value="${escapeHTML(room.name)}" class="flex-1 px-2 py-1 text-xs font-bold rounded border border-notion-border bg-white" placeholder="教室名" />
                                <select id="editRoomColor_${index}" class="px-1.5 py-1 text-xs font-bold rounded border border-notion-border bg-white">
                                    <option value="indigo" ${room.color==='indigo'?'selected':''}>藍</option>
                                    <option value="emerald" ${room.color==='emerald'?'selected':''}>緑</option>
                                    <option value="orange" ${room.color==='orange'?'selected':''}>橙</option>
                                    <option value="sky" ${room.color==='sky'?'selected':''}>青</option>
                                    <option value="violet" ${room.color==='violet'?'selected':''}>紫</option>
                                    <option value="pink" ${room.color==='pink'?'selected':''}>桃</option>
                                    <option value="amber" ${room.color==='amber'?'selected':''}>黄</option>
                                    <option value="teal" ${room.color==='teal'?'selected':''}>青緑</option>
                                </select>
                            </div>
                            <div class="flex items-center justify-between gap-2">
                                <select id="editRoomIcon_${index}" class="flex-1 px-2 py-1 text-xs font-bold rounded border border-notion-border bg-white">
                                    <option value="ph-door-open" ${room.icon==='ph-door-open'?'selected':''}>🚪 汎用教室</option>
                                    <option value="ph-presentation-chart" ${room.icon==='ph-presentation-chart'?'selected':''}>📊 多目的・講堂</option>
                                    <option value="ph-basketball" ${room.icon==='ph-basketball'?'selected':''}>🏀 体育館・屋外</option>
                                    <option value="ph-shield-chevron" ${room.icon==='ph-shield-chevron'?'selected':''}>🥋 武道・格技</option>
                                    <option value="ph-music-notes" ${room.icon==='ph-music-notes'?'selected':''}>🎵 音楽・音響</option>
                                    <option value="ph-piano-keys" ${room.icon==='ph-piano-keys'?'selected':''}>🎹 ピアノ・楽器</option>
                                    <option value="ph-chats-circle" ${room.icon==='ph-chats-circle'?'selected':''}>💬 談話・ラウンジ</option>
                                    <option value="ph-users-three" ${room.icon==='ph-users-three'?'selected':''}>👥 会議・ミーティング</option>
                                    <option value="ph-books" ${room.icon==='ph-books'?'selected':''}>📚 図書・自習</option>
                                    <option value="ph-desktop" ${room.icon==='ph-desktop'?'selected':''}>💻 PC・情報室</option>
                                    <option value="ph-flask" ${room.icon==='ph-flask'?'selected':''}>🧪 理科室・実験</option>
                                    <option value="ph-palette" ${room.icon==='ph-palette'?'selected':''}>🎨 美術室・工作</option>
                                    <option value="ph-cooking-pot" ${room.icon==='ph-cooking-pot'?'selected':''}>🍳 調理・家庭科</option>
                                </select>
                                <div class="flex items-center gap-1">
                                    <button type="button" onclick="window.cancelEditRoom()" class="px-2 py-1 text-xs font-bold rounded bg-white border border-notion-border text-notion-muted">取消</button>
                                    <button type="button" onclick="window.saveEditRoom(${index})" class="px-2.5 py-1 text-xs font-bold rounded bg-indigo-600 text-white hover:bg-indigo-700 shadow-2xs">保存</button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                return `
                    <div class="flex items-center justify-between p-2 rounded-xl bg-white border border-notion-border shadow-2xs hover:bg-slate-50/50 transition">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 rounded-md ${theme.badgeBg} ${theme.badgeText} flex items-center justify-center shrink-0">
                                <i class="ph-bold ${room.icon} text-xs"></i>
                            </span>
                            <span class="font-bold text-xs text-notion-text">${escapeHTML(room.name)}</span>
                        </div>
                        <div class="flex items-center gap-1">
                            <button type="button" onclick="window.startEditRoom(${index})" class="p-1 rounded text-notion-muted hover:text-indigo-600 hover:bg-indigo-50 border border-notion-border" title="名称・アイコン・色を変更">
                                <i class="ph-bold ph-pencil-simple text-xs"></i>
                            </button>
                            <button type="button" onclick="window.moveRoomOrder(${index}, -1)" ${index === 0 ? 'disabled class="p-1 rounded text-slate-300"' : 'class="p-1 rounded text-notion-text hover:bg-notion-sidebar border border-notion-border"'} title="上へ">
                                <i class="ph-bold ph-arrow-up text-xs"></i>
                            </button>
                            <button type="button" onclick="window.moveRoomOrder(${index}, 1)" ${index === state.rooms.length - 1 ? 'disabled class="p-1 rounded text-slate-300"' : 'class="p-1 rounded text-notion-text hover:bg-notion-sidebar border border-notion-border"'} title="下へ">
                                <i class="ph-bold ph-arrow-down text-xs"></i>
                            </button>
                            <button type="button" onclick="window.promptDeleteRoom(${index})" class="p-1 rounded text-rose-500 hover:bg-rose-50 border border-rose-200 ml-1" title="教室を削除">
                                <i class="ph-bold ph-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 教室編集の開始・キャンセル・保存
        window.startEditRoom = function(index) {
            editingRoomIndex = index;
            deletingRoomIndex = null;
            renderRoomManageList();
        };
        window.cancelEditRoom = function() {
            editingRoomIndex = null;
            renderRoomManageList();
        };
        window.saveEditRoom = function(index) {
            const name = document.getElementById(`editRoomName_${index}`).value.trim();
            if (!name) {
                showToast('教室名を入力してください', 'error');
                return;
            }
            const color = document.getElementById(`editRoomColor_${index}`).value;
            const icon = document.getElementById(`editRoomIcon_${index}`).value;

            state.rooms[index].name = name;
            state.rooms[index].color = color;
            state.rooms[index].icon = icon;

            set(ref(database, 'roomsConfig'), state.rooms);
            editingRoomIndex = null;
            renderRoomManageList();
            renderAll();
            showToast(`教室情報を更新しました`);
        };

        // 教室削除のインライン2段階確認
        window.promptDeleteRoom = function(index) {
            if (state.rooms.length <= 1) {
                showToast('教室は最低1つ必要です', 'error');
                return;
            }
            editingRoomIndex = null;
            deletingRoomIndex = index;
            renderRoomManageList();
        };
        window.cancelDeleteRoom = function() {
            deletingRoomIndex = null;
            renderRoomManageList();
        };
        window.confirmDeleteRoom = function(index) {
            const targetRoom = state.rooms[index];
            if (!targetRoom) return;
            const deletedName = targetRoom.name;

            state.rooms.splice(index, 1);
            set(ref(database, 'roomsConfig'), state.rooms);
            deletingRoomIndex = null;
            renderRoomManageList();
            renderAll();
            showToast(`「${deletedName}」を削除しました`, 'info');
        };

        // 教室の新規追加
        window.addNewRoom = function() {
            const nameInput = document.getElementById('newRoomName');
            const name = nameInput.value.trim();
            if (!name) {
                showToast('教室名を入力してください', 'error');
                return;
            }
            const icon = document.getElementById('newRoomIcon').value;
            const color = document.getElementById('newRoomColor').value;
            const newId = 'room_' + Date.now().toString(36);

            const newRoom = { id: newId, name: name, icon: icon, color: color };
            state.rooms.push(newRoom);
            set(ref(database, 'roomsConfig'), state.rooms);

            nameInput.value = '';
            renderRoomManageList();
            renderAll();
            showToast(`「${name}」を追加しました`);
        };

        window.moveRoomOrder = function(index, dir) {
            const targetIdx = index + dir;
            if (targetIdx < 0 || targetIdx >= state.rooms.length) return;
            const updated = [...state.rooms];
            const temp = updated[index];
            updated[index] = updated[targetIdx];
            updated[targetIdx] = temp;
            state.rooms = updated;
            set(ref(database, 'roomsConfig'), updated);
            renderRoomManageList();
            renderAll();
        };

        window.resetRoomsToDefaultOrder = function() {
            state.rooms = JSON.parse(JSON.stringify(DEFAULT_ROOMS));
            set(ref(database, 'roomsConfig'), state.rooms);
            editingRoomIndex = null;
            deletingRoomIndex = null;
            renderRoomManageList();
            renderAll();
            showToast('教室を標準セットに戻しました', 'info');
        };

        function renderAll() {
            renderHeaderControls();
            renderMoveBanner();
            ['matrix', 'weekly', 'calendar'].forEach(v => {
                const el = document.getElementById(`view-${v}`);
                if (el) el.classList.toggle('hidden', v !== state.currentView);
            });
            if (state.currentView === 'matrix') renderMatrixView();
            else if (state.currentView === 'weekly') renderWeeklyView();
            else if (state.currentView === 'calendar') renderCalendarView();
        }

        function renderHeaderControls() {
            const dateInput = document.getElementById('headerDatePicker');
            if (dateInput) dateInput.value = state.selectedDate;
            const dayOfWeekEl = document.getElementById('selectedDayOfWeek');
            if (dayOfWeekEl) dayOfWeekEl.textContent = `${DAY_NAMES[parseDateISO(state.selectedDate).getDay()]}曜日`;

            const modeBtn = document.getElementById('btnDayScheduleMode');
            const modeLabel = document.getElementById('dayScheduleModeLabel');
            if (modeBtn && modeLabel) {
                if (getDayScheduleMode(state.selectedDate) === '5period') {
                    modeBtn.className = 'px-2 py-1 text-[10px] sm:text-xs font-bold rounded-lg bg-amber-50 text-amber-800 border border-amber-300 flex items-center gap-1 shadow-2xs';
                    modeLabel.textContent = '5校時日課';
                } else {
                    modeBtn.className = 'px-2 py-1 text-[10px] sm:text-xs font-bold rounded-lg bg-indigo-50 text-indigo-700 border border-indigo-200 flex items-center gap-1 shadow-2xs';
                    modeLabel.textContent = '6校時日課';
                }
            }

            const liveBadge = document.getElementById('liveTodayBadge');
            if (liveBadge) liveBadge.classList.toggle('hidden', state.selectedDate !== state.todayISO);

            ['matrix', 'weekly', 'calendar'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const mobBtn = document.getElementById(`mob-tab-${tab}`);
                if (tab === state.currentView) {
                    if(btn) btn.className = 'view-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold bg-indigo-600 text-white whitespace-nowrap shadow-xs';
                    if(mobBtn) mobBtn.className = 'flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold text-indigo-700 bg-indigo-50 shadow-2xs w-1/4';
                } else {
                    if(btn) btn.className = 'view-tab flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-notion-muted hover:bg-notion-sidebar whitespace-nowrap';
                    if(mobBtn) mobBtn.className = 'flex flex-col items-center gap-0.5 px-2 py-1 rounded-lg text-[10px] font-bold text-notion-muted w-1/4';
                }
            });
        }

        function renderMoveBanner() {
            const banner = document.getElementById('mobileMoveBanner');
            if (banner) {
                if (state.movingReservationId) banner.classList.remove('hidden');
                else banner.classList.add('hidden');
            }
        }

        window.startTileMoveMode = function(id, e) {
            if(e) e.stopPropagation();
            state.movingReservationId = id;
            renderAll();
            showToast('移動先の空き枠をタップしてください', 'info');
        };
        window.triggerMoveFromModal = function() {
            const id = document.getElementById('resFormId').value;
            window.closeReservationModal();
            window.startTileMoveMode(id);
        };
        window.cancelTileMoveMode = function() { state.movingReservationId = null; renderAll(); };

        window.executeReservationMove = function(dragId, targetR, targetD, targetP) {
            const dragRes = state.reservations.find(r => r.id === dragId);
            if (!dragRes) return;
            const destRoomId = targetR && targetR !== 'null' ? targetR : dragRes.roomId;
            
            const origStartIdx = TIME_PERIODS.findIndex(p => p.id === (dragRes.startPeriodId || dragRes.periodId));
            const origEndIdx = TIME_PERIODS.findIndex(p => p.id === (dragRes.endPeriodId || dragRes.periodId));
            const span = (origStartIdx !== -1 && origEndIdx !== -1) ? (origEndIdx - origStartIdx) : 0;
            
            const targetStartIdx = TIME_PERIODS.findIndex(p => p.id === targetP);
            if (targetStartIdx === -1) return;
            const targetEndIdx = Math.min(TIME_PERIODS.length - 1, targetStartIdx + span);
            const targetEndP = TIME_PERIODS[targetEndIdx].id;

            set(ref(database, 'reservations/' + dragId), {
                ...dragRes,
                roomId: destRoomId,
                date: targetD,
                periodId: targetP,
                startPeriodId: targetP,
                endPeriodId: targetEndP
            });

            state.movingReservationId = null;
            showToast('予約を移動しました');
        };

        window.handleDragStart = function(e, id) {
            e.dataTransfer.setData('text/plain', id);
            e.dataTransfer.effectAllowed = 'move';
            state.draggedReservationId = id;
            setTimeout(() => e.target.classList.add('opacity-40', 'scale-95'), 0);
        };
        window.handleDragEnd = function(e) {
            e.target.classList.remove('opacity-40', 'scale-95');
            state.draggedReservationId = null;
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        };
        window.handleDragOver = function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; };
        window.handleDragEnter = function(e) { e.preventDefault(); const zone = e.target.closest('.drop-zone'); if (zone) zone.classList.add('drag-over'); };
        window.handleDragLeave = function(e) { const zone = e.target.closest('.drop-zone'); if (zone && !zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); };
        window.handleDrop = function(e, targetR, targetD, targetP) {
            e.preventDefault();
            const zone = e.target.closest('.drop-zone');
            if (zone) zone.classList.remove('drag-over');
            const dragId = e.dataTransfer.getData('text/plain') || state.draggedReservationId;
            if (dragId) window.executeReservationMove(dragId, targetR, targetD, targetP);
        };
        
        window.handleSlotInteraction = function(r, d, p, existId = null) {
            if (state.movingReservationId) return window.executeReservationMove(state.movingReservationId, r, d, p);
            
            if (existId && existId !== 'null') {
                window.openReservationModal({ reservationId: existId });
            } else {
                window.openReservationModal({ roomId: r && r !== 'null' ? r : state.rooms[0].id, date: d, periodId: p });
            }
        };

        // VIEW: 当日一覧 (Matrix)
        function renderMatrixView() {
            const dateH = document.getElementById('matrixDateHeading');
            if (dateH) dateH.textContent = formatJapaneseDateLabel(state.selectedDate);

            let html = `<div class="matrix-grid border-b border-notion-border bg-notion-sidebar sticky top-0 z-20">
                <div class="bg-notion-sidebar border-r border-notion-border p-1 flex items-center justify-center font-bold text-[10px] text-notion-muted">教室</div>`;
            TIME_PERIODS.forEach(p => {
                const info = getPeriodDisplayInfo(p, state.selectedDate);
                html += `<div class="p-1 text-center border-r border-notion-border flex flex-col justify-center items-center ${p.isFreeSlot ? 'bg-indigo-50/40' : ''}">
                    <div class="text-[10px] font-bold text-notion-text leading-tight truncate w-full">${escapeHTML(info.short)}</div>
                    <div class="text-[8px] text-notion-muted leading-none mt-0.5 hidden sm:block">${escapeHTML(info.time.split(' ')[0])}</div>
                </div>`;
            });
            html += `</div>`;

            state.rooms.forEach(room => {
                const theme = ROOM_COLOR_MAP[room.color] || ROOM_COLOR_MAP.indigo;
                const shortRoomName = formatShortRoomName(room.name);

                html += `<div class="matrix-grid border-b border-notion-border hover:bg-notion-bg/40 min-h-[54px]">
                    <div class="bg-white border-r border-notion-border p-1 flex flex-col items-center justify-center">
                        <span class="w-6 h-6 rounded-md ${theme.badgeBg} ${theme.badgeText} flex items-center justify-center mb-0.5">
                            <i class="ph-bold ${room.icon} text-xs"></i>
                        </span>
                        <span class="font-bold text-[10px] text-notion-text tracking-tighter leading-tight text-center">${escapeHTML(shortRoomName)}</span>
                    </div>`;
                
                TIME_PERIODS.forEach(p => {
                    const res = state.reservations.find(r => r.roomId === room.id && r.date === state.selectedDate && isReservationInPeriod(r, p.id));
                    html += renderSlotTileHTML(room, state.selectedDate, p, res);
                });
                html += `</div>`;
            });
            const container = document.getElementById('matrixGridContainer');
            if (container) container.innerHTML = html;
        }

        // VIEW: 週間表示 (Weekly)
        function renderWeeklyView() {
            const weekDays = Array.from({length: 7}, (_, i) => addDaysISO(state.selectedDate, i));
            
            let html = `<div class="weekly-grid-row border-b border-notion-border bg-notion-sidebar sticky top-0 z-20">
                <div class="bg-notion-sidebar border-r border-notion-border p-1 flex items-center justify-center font-bold text-[10px] text-notion-muted">日付</div>`;
            TIME_PERIODS.forEach(p => {
                const info = getPeriodDisplayInfo(p, state.selectedDate);
                html += `<div class="p-1 text-center border-r border-notion-border flex flex-col justify-center items-center ${p.isFreeSlot ? 'bg-indigo-50/40' : ''}">
                    <div class="text-[10px] font-bold text-notion-text leading-tight truncate w-full">${escapeHTML(info.short)}</div>
                    <div class="text-[8px] text-notion-muted leading-none mt-0.5 hidden sm:block">${escapeHTML(info.time.split(' ')[0])}</div>
                </div>`;
            });
            html += `</div>`;

            weekDays.forEach(d => {
                const dt = parseDateISO(d);
                const isSel = (d === state.selectedDate);
                const isWeekend = (dt.getDay() === 0 || dt.getDay() === 6);
                const mode = getDayScheduleMode(d);
                const dayReservations = state.reservations.filter(r => r.date === d);
                const hasAnyRes = dayReservations.length > 0;

                const rowMinHeight = (!hasAnyRes && isWeekend) ? 'min-h-[38px]' : (!hasAnyRes ? 'min-h-[50px]' : 'min-h-[78px]');

                html += `<div class="weekly-grid-row border-b border-notion-border bg-white ${rowMinHeight} transition-all">
                    <div onclick="window.handleDateInput('${d}')" class="p-1 border-r border-notion-border flex flex-col justify-center items-center text-center cursor-pointer transition select-none ${isSel ? 'bg-indigo-600 text-white' : (isWeekend ? 'bg-slate-50 hover:bg-slate-100 text-notion-muted' : 'bg-notion-sidebar hover:bg-notion-hover text-notion-text')}">
                        <span class="font-bold text-[10px] leading-none">${dt.getMonth()+1}/${dt.getDate()}</span>
                        <span class="font-bold text-[9px] leading-tight mt-0.5">(${DAY_NAMES[dt.getDay()]})</span>
                    </div>`;
                
                TIME_PERIODS.forEach(p => {
                    const cellRes = state.reservations.filter(r => r.date === d && isReservationInPeriod(r, p.id));
                    
                    // 教室の表示順序（state.rooms）に従って一貫ソート
                    cellRes.sort((a, b) => {
                        const idxA = state.rooms.findIndex(rm => rm.id === a.roomId);
                        const idxB = state.rooms.findIndex(rm => rm.id === b.roomId);
                        return (idxA === -1 ? 99 : idxA) - (idxB === -1 ? 99 : idxB);
                    });

                    const is5PeriodAfter = (mode === '5period' && p.id === 'p6');
                    const hasCellRes = cellRes.length > 0;

                    html += `<div class="border-r border-notion-border flex flex-col gap-1 p-1 drop-zone h-full relative justify-center ${is5PeriodAfter ? 'bg-amber-50/20' : ''}" ondragover="window.handleDragOver(event)" ondragenter="window.handleDragEnter(event)" ondragleave="window.handleDragLeave(event)" ondrop="window.handleDrop(event, null, '${d}', '${p.id}')">`;
                    
                    if (is5PeriodAfter && !hasCellRes) {
                        html += `<div class="m-auto text-[8px] text-amber-700/70 font-bold text-center leading-tight">5限後<br>放課後</div>`;
                    }

                    cellRes.forEach(res => {
                        const room = getRoomById(res.roomId);
                        const cat = getCategoryById(res.category);
                        const isMoving = state.movingReservationId === res.id;
                        const isMulti = (res.startPeriodId && res.endPeriodId && res.startPeriodId !== res.endPeriodId);

                        html += `<div draggable="true" ondragstart="window.handleDragStart(event, '${res.id}')" ondragend="window.handleDragEnd(event)" onclick="window.handleSlotInteraction('${res.roomId}', '${d}', '${p.id}', '${res.id}')" class="w-full rounded border ${cat.border} bg-white shadow-2xs p-1 flex flex-col relative overflow-hidden group cursor-grab active:cursor-grabbing reservation-tile min-w-0 ${isMoving ? 'opacity-40 ring-2 ring-indigo-500' : ''}">
                            <div class="absolute top-0 left-0 bottom-0 w-0.5 ${cat.dot}"></div>
                            <div class="pl-1 flex flex-col min-w-0">
                                <div class="flex items-center justify-between gap-0.5 min-w-0 leading-none mb-0.5">
                                    <span class="text-[9px] font-bold text-indigo-700 bg-indigo-50 px-1 py-0.5 rounded whitespace-nowrap truncate min-w-0">【${formatShortRoomName(room.name)}】</span>
                                    ${isMulti ? `<span class="text-[8px] font-bold text-slate-500 bg-slate-100 px-0.5 rounded">連</span>` : ''}
                                </div>
                                <div class="font-bold text-[10px] text-notion-text truncate leading-tight w-full">${escapeHTML(res.user)}</div>
                                ${res.customTime ? `<div class="text-[8px] font-bold text-indigo-600 truncate leading-none mt-0.5">⏰${escapeHTML(res.customTime)}</div>` : ''}
                            </div>
                        </div>`;
                    });

                    if (!hasCellRes && !is5PeriodAfter) {
                        html += `<button onclick="window.handleSlotInteraction(null, '${d}', '${p.id}', null)" class="w-full h-full min-h-[24px] rounded border border-dashed border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/40 transition flex items-center justify-center text-slate-300 hover:text-emerald-600 group" title="予約追加">
                            <i class="ph-bold ph-plus text-xs group-hover:scale-110 transition"></i>
                        </button>`;
                    }
                    html += `</div>`;
                });
                html += `</div>`;
            });
            const gridEl = document.getElementById('allRoomsWeeklyGrid');
            if (gridEl) gridEl.innerHTML = html;
        }

        function renderSlotTileHTML(room, dateStr, period, res) {
            const isMovingTarget = Boolean(state.movingReservationId);
            const dropAttrs = `ondragover="window.handleDragOver(event)" ondragenter="window.handleDragEnter(event)" ondragleave="window.handleDragLeave(event)" ondrop="window.handleDrop(event, '${room.id}', '${dateStr}', '${period.id}')"`;

            if (!res) {
                return `<div class="p-1 border-r border-notion-border flex drop-zone h-full min-w-0" ${dropAttrs}>
                    <button onclick="window.handleSlotInteraction('${room.id}', '${dateStr}', '${period.id}', null)" class="w-full h-full min-h-[46px] rounded border border-dashed border-slate-200 hover:border-emerald-300 hover:bg-emerald-50/30 transition flex flex-col items-center justify-center group ${isMovingTarget ? 'move-target-pulse bg-indigo-50 border-indigo-300' : ''}">
                        <span class="text-[9px] font-bold text-slate-400 group-hover:text-emerald-700 flex items-center gap-0.5">
                            <i class="ph-bold ${isMovingTarget ? 'ph-arrow-elbow-down-right text-indigo-600' : 'ph-plus'} text-xs"></i>
                            <span class="hidden sm:inline">${isMovingTarget ? '移動' : '空き'}</span>
                        </span>
                    </button>
                </div>`;
            }
            
            const cat = getCategoryById(res.category);
            const isMoving = (state.movingReservationId === res.id);

            return `<div class="p-1 border-r border-notion-border flex drop-zone h-full min-w-0" ${dropAttrs}>
                <div draggable="true" ondragstart="window.handleDragStart(event, '${res.id}')" ondragend="window.handleDragEnd(event)" onclick="window.handleSlotInteraction('${room.id}', '${dateStr}', '${period.id}', '${res.id}')" class="w-full h-full min-h-[46px] rounded border ${cat.border} bg-white shadow-2xs p-1 flex flex-col relative overflow-hidden group cursor-grab active:cursor-grabbing reservation-tile min-w-0 ${isMoving ? 'opacity-40 ring-2 ring-indigo-500' : ''}">
                    <div class="absolute top-0 left-0 right-0 h-1 ${cat.dot}"></div>
                    <span class="text-[8px] font-bold ${cat.text} bg-white/90 px-1 py-0.5 rounded w-fit mb-0.5 leading-tight shrink-0 mt-0.5 truncate max-w-full">${cat.label}</span>
                    <div class="font-bold text-[10px] text-notion-text truncate leading-tight w-full">${escapeHTML(res.user)}</div>
                    ${res.customTime ? `<div class="text-[8px] font-bold text-indigo-600 leading-none mt-0.5 truncate">⏰${escapeHTML(res.customTime)}</div>` : ''}
                    <button type="button" onclick="window.startTileMoveMode('${res.id}', event)" class="absolute bottom-0.5 right-0.5 p-0.5 rounded text-slate-300 hover:text-indigo-600 transition" title="移動">
                        <i class="ph-bold ph-arrows-out-cardinal text-xs"></i>
                    </button>
                </div>
            </div>`;
        }

        // VIEW: カレンダー (Calendar)
        window.changeCalendarMonth = function(delta) {
            let m = state.calendarMonth + delta; let y = state.calendarYear;
            if (m > 11) { m = 0; y++; } else if (m < 0) { m = 11; y--; }
            state.calendarMonth = m; state.calendarYear = y; renderAll();
        };
        window.resetCalendarToCurrentMonth = function() {
            const now = new Date(); state.calendarMonth = now.getMonth(); state.calendarYear = now.getFullYear(); renderAll();
        };
        function renderCalendarView() {
            const y = state.calendarYear, m = state.calendarMonth;
            const heading = document.getElementById('calendarMonthHeading');
            if (heading) heading.textContent = `${y}年 ${m + 1}月`;
            const grid = document.getElementById('calendarDaysGrid');
            if (!grid) return;

            const firstDay = new Date(y, m, 1), lastDay = new Date(y, m + 1, 0);
            const startDow = firstDay.getDay(), daysInMonth = lastDay.getDate();

            let html = '';
            for (let i = 0; i < startDow; i++) html += `<div class="p-2 opacity-0 pointer-events-none"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const isoStr = formatDateISO(new Date(y, m, d));
                const isToday = isoStr === state.todayISO;
                const isSel = isoStr === state.selectedDate;
                const dayRes = state.reservations.filter(r => r.date === isoStr);
                
                html += `<div onclick="window.handleCalendarDayClick('${isoStr}')" class="p-1.5 sm:p-2.5 flex flex-col items-center justify-start rounded-xl border border-notion-border cursor-pointer transition ${isSel ? 'ring-2 ring-indigo-500 bg-indigo-50' : 'hover:bg-notion-hover bg-white'}">
                    <span class="text-xs font-bold ${isToday ? 'bg-indigo-600 text-white w-5 h-5 flex items-center justify-center rounded-full' : 'text-notion-text'}">${d}</span>
                    ${dayRes.length > 0 ? `<div class="w-1.5 h-1.5 rounded-full bg-indigo-500 mt-1 mx-auto shadow-2xs"></div>` : ''}
                    <span class="text-[9px] font-bold text-notion-muted mt-0.5">${dayRes.length > 0 ? dayRes.length + '件' : '&nbsp;'}</span>
                </div>`;
            }
            grid.innerHTML = html;
            renderCalendarDayDetail();
        }
        window.handleCalendarDayClick = function(isoStr) { state.selectedDate = isoStr; renderAll(); };
        function renderCalendarDayDetail() {
            const c = document.getElementById('calendarMobileDayDetail');
            if (!c) return;
            const dayRes = state.reservations.filter(r => r.date === state.selectedDate);
            const dt = parseDateISO(state.selectedDate);
            let html = `<h4 class="font-bold text-xs sm:text-sm mb-2.5 flex items-center gap-1.5"><i class="ph-bold ph-calendar-check text-indigo-600 text-base"></i>${dt.getMonth()+1}月${dt.getDate()}日 の予約</h4>`;
            if (dayRes.length === 0) {
                html += `<p class="text-notion-muted text-xs font-bold bg-notion-sidebar p-2.5 rounded-xl">予約はありません。</p>`;
            } else {
                html += `<div class="grid grid-cols-2 sm:grid-cols-4 gap-2">`;
                dayRes.forEach(r => {
                    const room = getRoomById(r.roomId), period = getPeriodById(r.startPeriodId || r.periodId), cat = getCategoryById(r.category);
                    html += `<div class="p-2 rounded-xl border border-notion-border flex flex-col gap-1 bg-white shadow-2xs cursor-pointer hover:bg-notion-hover" onclick="window.switchView('matrix')">
                        <div class="flex items-center justify-between mb-0.5">
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${cat.bg} ${cat.text}">${cat.label}</span>
                            <span class="text-[9px] font-bold text-notion-muted">${period.short}</span>
                        </div>
                        <div class="font-bold text-xs text-notion-text truncate"><i class="ph-bold ${room.icon} mr-1 text-indigo-600"></i>${escapeHTML(room.name)}</div>
                        <div class="text-[10px] font-bold text-notion-text truncate">${escapeHTML(r.user)}</div>
                    </div>`;
                });
                html += `</div>`;
            }
            c.innerHTML = html;
        }

        window.setTimeInputMode = function(mode) {
            const isPeriod = (mode === 'period');
            document.getElementById('timeModePeriodSection').classList.toggle('hidden', !isPeriod);
            document.getElementById('timeModeCustomSection').classList.toggle('hidden', isPeriod);
            
            const btnP = document.getElementById('btnModePeriod');
            const btnC = document.getElementById('btnModeCustom');
            if (isPeriod) {
                btnP.className = 'px-2 py-0.5 rounded-md font-bold bg-indigo-600 text-white shadow-2xs';
                btnC.className = 'px-2 py-0.5 rounded-md font-bold text-notion-muted hover:bg-white';
            } else {
                btnP.className = 'px-2 py-0.5 rounded-md font-bold text-notion-muted hover:bg-white';
                btnC.className = 'px-2 py-0.5 rounded-md font-bold bg-indigo-600 text-white shadow-2xs';
            }
        };

        function populateHourMinuteSelects() {
            const sh = document.getElementById('customStartHour');
            const sm = document.getElementById('customStartMin');
            const eh = document.getElementById('customEndHour');
            const em = document.getElementById('customEndMin');

            let hoursHTML = '';
            for (let h = 7; h <= 19; h++) {
                const hh = String(h).padStart(2, '0');
                hoursHTML += `<option value="${hh}">${hh}時</option>`;
            }
            sh.innerHTML = hoursHTML;
            eh.innerHTML = hoursHTML;

            let minsHTML = '';
            for (let m = 0; m < 60; m += 5) {
                const mm = String(m).padStart(2, '0');
                minsHTML += `<option value="${mm}">${mm}分</option>`;
            }
            sm.innerHTML = minsHTML;
            em.innerHTML = minsHTML;
        }

        function populatePeriodOptions(dateStr, startSelId, endSelId) {
            const startSel = document.getElementById('resFormStartPeriod');
            const endSel = document.getElementById('resFormEndPeriod');
            
            startSel.innerHTML = TIME_PERIODS.map(p => {
                const info = getPeriodDisplayInfo(p, dateStr);
                const startTime = (p.defaultStart || info.time.split(' ')[0] || '');
                return `<option value="${p.id}">${escapeHTML(info.label)}（${startTime}〜）</option>`;
            }).join('');

            endSel.innerHTML = TIME_PERIODS.map(p => {
                const info = getPeriodDisplayInfo(p, dateStr);
                const parts = info.time.split(' ');
                const endTime = (p.defaultEnd || parts[parts.length - 1] || '');
                return `<option value="${p.id}">${escapeHTML(info.label)}（〜${endTime}）</option>`;
            }).join('');

            if(startSelId) startSel.value = startSelId;
            if(endSelId) endSel.value = endSelId;
            else if(startSelId) endSel.value = startSelId;
        }

        window.handleModalDateOrPeriodChange = function() {
            const dateStr = document.getElementById('resFormDate').value;
            const startVal = document.getElementById('resFormStartPeriod').value;
            const endVal = document.getElementById('resFormEndPeriod').value;
            
            const startIdx = TIME_PERIODS.findIndex(p => p.id === startVal);
            const endIdx = TIME_PERIODS.findIndex(p => p.id === endVal);
            
            if (endIdx < startIdx) {
                document.getElementById('resFormEndPeriod').value = startVal;
            }
            window.checkFormConflictWarning();
        };

        window.setCategory = function(id) { state.selectedCategory = id; renderCategoryGroup(); };
        function renderCategoryGroup() {
            document.getElementById('resFormCategoryGroup').innerHTML = CATEGORIES.map(c => `
                <button type="button" onclick="window.setCategory('${c.id}')" class="py-1.5 px-1 rounded-lg border text-[10px] font-bold flex flex-col items-center justify-center gap-0.5 transition-all ${state.selectedCategory===c.id ? `${c.bg} ${c.border} ${c.text} ring-2 ring-indigo-500 shadow-2xs scale-105` : 'bg-white border-notion-border text-notion-muted hover:bg-notion-hover'}">
                    <span class="w-2 h-2 rounded-full ${c.dot}"></span>${c.label}
                </button>
            `).join('');
        }
        
        window.openReservationModal = function(opt = {}) {
            const m = document.getElementById('reservationModal');
            document.getElementById('resFormRoom').innerHTML = state.rooms.map(r => `<option value="${r.id}">${escapeHTML(r.name)}</option>`).join('');
            
            populateHourMinuteSelects();

            const res = opt.reservationId ? state.reservations.find(r=>r.id===opt.reservationId) : null;
            const targetDate = res ? res.date : (opt.date || state.selectedDate);
            
            const startP = res ? (res.startPeriodId || res.periodId) : (opt.periodId || 'p1');
            const endP = res ? (res.endPeriodId || res.periodId) : (opt.periodId || 'p1');
            
            populatePeriodOptions(targetDate, startP, endP);
            
            document.getElementById('resFormId').value = res ? res.id : '';
            document.getElementById('resFormRoom').value = res ? res.roomId : (opt.roomId || state.rooms[0].id);
            document.getElementById('resFormDate').value = targetDate;
            state.selectedCategory = res ? res.category : 'class';
            document.getElementById('resFormUser').value = res ? res.user : '';
            document.getElementById('resFormTitle').value = res ? (res.title||'') : '';
            document.getElementById('resFormMemo').value = res ? (res.memo||'') : '';
            
            if (res && res.customTime && res.customTime.includes('〜')) {
                const parts = res.customTime.split('〜');
                if (parts[0] && parts[0].includes(':')) {
                    const [h, min] = parts[0].split(':');
                    document.getElementById('customStartHour').value = h;
                    document.getElementById('customStartMin').value = min;
                }
                if (parts[1] && parts[1].includes(':')) {
                    const [h, min] = parts[1].split(':');
                    document.getElementById('customEndHour').value = h;
                    document.getElementById('customEndMin').value = min;
                }
                window.setTimeInputMode('custom');
            } else {
                window.setTimeInputMode('period');
            }

            const btnDel = document.getElementById('btnDeleteReservation');
            const inlineConfirm = document.getElementById('inlineDeleteConfirm');
            inlineConfirm.classList.add('hidden');

            if (res) {
                btnDel.classList.remove('hidden');
                document.getElementById('btnStartTouchMove').classList.remove('hidden');
                document.getElementById('btnSubmitReservationText').textContent = '変更を保存';
            } else {
                btnDel.classList.add('hidden');
                document.getElementById('btnStartTouchMove').classList.add('hidden');
                document.getElementById('btnSubmitReservationText').textContent = '予約確定';
            }
            
            renderCategoryGroup(); 
            window.checkFormConflictWarning(); 
            window.clearUserValidationError();
            m.classList.remove('hidden'); 
            m.classList.add('flex');
        };

        window.closeReservationModal = function() { 
            const m = document.getElementById('reservationModal');
            m.classList.add('hidden'); 
            m.classList.remove('flex'); 
        };
        
        window.fillUserPreset = function(txt) {
            const inp = document.getElementById('resFormUser');
            inp.value = inp.value ? `${inp.value} ${txt}` : txt;
            window.clearUserValidationError();
        };
        window.clearUserValidationError = function() {
            document.getElementById('resFormUser').classList.remove('border-rose-500');
            document.getElementById('resFormUserError').classList.add('hidden');
        };
        
        window.checkFormConflictWarning = function() {
            const r = document.getElementById('resFormRoom').value, d = document.getElementById('resFormDate').value;
            const startVal = document.getElementById('resFormStartPeriod').value;
            const endVal = document.getElementById('resFormEndPeriod').value;
            const startIdx = TIME_PERIODS.findIndex(p => p.id === startVal);
            const endIdx = TIME_PERIODS.findIndex(p => p.id === endVal);

            let hasConflict = false;
            for (let i = startIdx; i <= endIdx; i++) {
                const pId = TIME_PERIODS[i].id;
                const exist = state.reservations.find(res => res.roomId === r && res.date === d && isReservationInPeriod(res, pId));
                if (exist && exist.id !== document.getElementById('resFormId').value) {
                    hasConflict = true;
                    break;
                }
            }

            const ban = document.getElementById('resFormConflictBanner');
            if(hasConflict) {
                ban.classList.remove('hidden'); 
                document.getElementById('resFormConflictText').textContent = '選択したコマ範囲に既に別の予約が存在します。';
            } else {
                ban.classList.add('hidden');
            }
        };

        window.saveReservationForm = function(e) {
            e.preventDefault();
            const id = document.getElementById('resFormId').value;
            const user = document.getElementById('resFormUser').value.trim();
            if(!user) {
                document.getElementById('resFormUser').classList.add('border-rose-500');
                document.getElementById('resFormUserError').classList.remove('hidden');
                return;
            }
            
            const rId = document.getElementById('resFormRoom').value;
            const dStr = document.getElementById('resFormDate').value;

            const isCustomMode = !document.getElementById('timeModeCustomSection').classList.contains('hidden');
            let startPId = document.getElementById('resFormStartPeriod').value;
            let endPId = document.getElementById('resFormEndPeriod').value;
            let customTimeStr = '';

            if (isCustomMode) {
                const sH = document.getElementById('customStartHour').value;
                const sM = document.getElementById('customStartMin').value;
                const eH = document.getElementById('customEndHour').value;
                const eM = document.getElementById('customEndMin').value;
                const sTime = `${sH}:${sM}`;
                const eTime = `${eH}:${eM}`;
                customTimeStr = `${sTime}〜${eTime}`;

                let matchedStartIdx = -1;
                let matchedEndIdx = -1;
                TIME_PERIODS.forEach((p, idx) => {
                    const pStart = p.defaultStart || '08:00';
                    const pEnd = p.defaultEnd || '17:00';
                    if (sTime < pEnd && eTime > pStart) {
                        if (matchedStartIdx === -1) matchedStartIdx = idx;
                        matchedEndIdx = idx;
                    }
                });

                if (matchedStartIdx !== -1 && matchedEndIdx !== -1) {
                    startPId = TIME_PERIODS[matchedStartIdx].id;
                    endPId = TIME_PERIODS[matchedEndIdx].id;
                }
            }
            
            const resData = {
                roomId: rId,
                date: dStr,
                periodId: startPId,
                startPeriodId: startPId,
                endPeriodId: endPId,
                customTime: customTimeStr,
                user: user,
                category: state.selectedCategory,
                title: document.getElementById('resFormTitle').value.trim(),
                memo: document.getElementById('resFormMemo').value.trim()
            };

            if(id) {
                set(ref(database, 'reservations/' + id), resData);
            } else {
                push(ref(database, 'reservations'), resData);
            }
            window.closeReservationModal(); 
            showToast('予約を保存しました');
        };

        // 確実なインライン削除処理
        const btnDelete = document.getElementById('btnDeleteReservation');
        const inlineConfirm = document.getElementById('inlineDeleteConfirm');
        const btnConfirmYes = document.getElementById('btnConfirmDeleteYes');
        const btnConfirmNo = document.getElementById('btnConfirmDeleteNo');

        if (btnDelete) {
            btnDelete.onclick = () => { inlineConfirm.classList.remove('hidden'); };
        }
        if (btnConfirmNo) {
            btnConfirmNo.onclick = () => { inlineConfirm.classList.add('hidden'); };
        }
        if (btnConfirmYes) {
            btnConfirmYes.onclick = () => {
                const id = document.getElementById('resFormId').value;
                if (!id) return;
                remove(ref(database, 'reservations/' + id))
                    .then(() => {
                        window.closeReservationModal();
                        showToast('予約を削除しました');
                    })
                    .catch(() => {
                        showToast('削除に失敗しました', 'error');
                    });
            };
        }

        function showToast(msg, type='success') {
            const c = document.getElementById('toastContainer');
            if (!c) return;
            const t = document.createElement('div');
            t.className = `text-white px-3.5 py-2 rounded-xl shadow-lg text-xs font-bold transition-all ${type==='error'?'bg-rose-600':(type==='info'?'bg-indigo-600':'bg-notion-text')}`;
            t.textContent = msg;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        window.addEventListener('DOMContentLoaded', () => { renderAll(); });
    </script>
</body>
</html>
